name: Lock in AI reading gains

# Re-blesses the AI card-reading ratchet's baseline (ai/src/test/resources/ai-reading-baseline.tsv)
# on main after a merge, so PRs don't have to. Every AI-reading PR used to re-bless it, and two of
# them open at once rewrote neighbouring lines of the same 20k-line file and conflicted. A PR that
# only raises coverage now leaves the file alone (AiReadingRatchetTest passes on a gain), and this
# job records the gain once it is on main.
#
# It re-blesses only when the ratchet passes on main: a regression that slipped in (two PRs that
# were each green alone) must fail CI, never be blessed into the baseline. A PR that brings a new
# unread effect type still re-blesses in the PR itself, because its own CI fails until it does.
#
# A push made with GITHUB_TOKEN doesn't trigger other workflows, so this never re-runs CI.

on:
  push:
    branches: [ "main" ]
    paths:
      - "ai/src/main/**"
      - "mtg-sets/**/src/main/**"
      - "mtg-sdk/src/main/**"
  workflow_dispatch:

# A newer push to main supersedes a running re-bless: its result covers everything the older one did.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rebless:
    runs-on: ubuntu-latest
    env:
      GRADLE_BUILD_CACHE_DIR: ${{ github.workspace }}/.gradle/build-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Reuse CI's `ai` group build cache (compiled corpus + ai module); never save, so this job
      # doesn't compete with CI's own entries.
      - name: Restore Gradle build outputs
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.gradle/build-cache
          key: gradle-build-cache-${{ runner.os }}-ai-${{ github.sha }}
          restore-keys: |
            gradle-build-cache-${{ runner.os }}-ai-
            gradle-build-cache-${{ runner.os }}-

      - name: Ratchet must pass before anything is blessed
        run: ./gradlew :ai:test --tests "*.AiReadingRatchetTest"

      - name: Re-bless the baseline
        run: |
          ./gradlew :ai:test --tests "*.AiReadingRatchetTest" --rerun \
            -DaiReadingBaseline="${GITHUB_WORKSPACE}/ai/src/test/resources/ai-reading-baseline.tsv"

      - name: Commit if changed
        run: |
          f=ai/src/test/resources/ai-reading-baseline.tsv
          git add "$f"
          if git diff --cached --quiet; then
            echo "Baseline already current."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ai: lock in AI reading gains (re-bless ai-reading-baseline.tsv)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main; then
              git push origin HEAD:main && exit 0
            else
              # Someone else changed the baseline meanwhile (a PR that re-blessed a new group).
              # The push of that merge runs this job again on top of it, so just stand down.
              git rebase --abort
              echo "::notice::Baseline changed on main during the run; the next run re-blesses it."
              exit 0
            fi
            sleep 5
          done
          exit 1
