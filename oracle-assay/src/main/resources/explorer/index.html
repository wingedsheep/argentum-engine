<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argentum Assay — Explorer</title>
<!-- The page is served by two transports: `assay explore`'s own loopback server, which mounts the
     endpoints at /api/, and game-server, which mounts the same handlers under a prefix so the
     Set Completion view can frame it. The prefix is therefore a serve-time substitution rather than
     a constant — ExploreApi.page(apiBase) replaces the token below. Opening this file straight off
     disk leaves the token in place and every request 404s, which is the intended failure: the page
     has never been usable without a server behind it. -->
<script>window.ASSAY_API_BASE = "%%ASSAY_API_BASE%%";</script>
<style>
  :root {
    color-scheme: light;
    --ground:   #F5F7F8;
    --surface:  #FFFFFF;
    --sunken:   #EBEEF0;
    --ink:      #14181B;
    --muted:    #58636D;
    --faint:    #8A949D;
    --hair:     #DBE0E4;
    --hair-2:   #C7CFD5;
    --accent:   #0B7462;
    --accent-w: #E2F0EC;
    --ochre:    #9C6A1E;
    --ochre-w:  #F4EBDA;
    --bad:      #A3242B;
    --bad-w:    #F6E3E3;
    --shadow:   0 1px 2px rgba(20,24,27,.05), 0 10px 28px -18px rgba(20,24,27,.28);
    --sel:      #E2F0EC;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground:  #0E1114; --surface: #161A1E; --sunken: #1C2227;
      --ink:     #E6EAEC; --muted:   #98A3AC; --faint:  #6E7A83;
      --hair:    #272E34; --hair-2:  #39424A;
      --accent:  #4EC4AB; --accent-w:#16302C;
      --ochre:   #D3A055; --ochre-w: #2E2618;
      --bad:     #E4787C; --bad-w:   #331B1D;
      --shadow:  0 1px 2px rgba(0,0,0,.5), 0 10px 28px -18px rgba(0,0,0,.8);
      --sel:     #16302C;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  .mono, code, pre { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 2px; }
  ::selection { background: var(--sel); }
  a { color: var(--accent); }

  .app { display: grid; grid-template-rows: auto 1fr; height: 100dvh; }

  /* ---- topbar ---- */
  .topbar {
    display: flex; align-items: center; gap: 1rem; padding: .5rem .85rem;
    border-bottom: 1px solid var(--hair); background: var(--surface); position: relative; z-index: 40;
  }
  .brand {
    font-family: ui-monospace, Menlo, monospace; font-size: .82rem; font-weight: 600;
    display: flex; align-items: baseline; gap: .5rem; white-space: nowrap;
  }
  .brand .sub { font-weight: 400; color: var(--faint); font-size: .68rem; letter-spacing: .09em; text-transform: uppercase; }

  .searchwrap { position: relative; flex: 1; max-width: 34rem; }
  #q {
    width: 100%; font-family: ui-monospace, Menlo, monospace; font-size: .8rem;
    padding: .42rem .7rem .42rem 1.9rem; border: 1px solid var(--hair-2); border-radius: 3px;
    background: var(--ground); color: var(--ink);
  }
  #q::placeholder { color: var(--faint); }
  .searchwrap .mag { position: absolute; left: .6rem; top: 50%; transform: translateY(-50%); color: var(--faint); font-size: .78rem; pointer-events: none; }
  .searchwrap .kbd { position: absolute; right: .5rem; top: 50%; transform: translateY(-50%); color: var(--faint); font-size: .65rem; pointer-events: none; font-family: ui-monospace, Menlo, monospace; }
  .results {
    position: absolute; top: calc(100% + .35rem); left: 0; right: 0; background: var(--surface);
    border: 1px solid var(--hair-2); border-radius: 3px; box-shadow: var(--shadow);
    max-height: 70vh; overflow-y: auto; display: none;
  }
  .results.on { display: block; }
  .results .sec {
    font-family: ui-monospace, Menlo, monospace; font-size: .62rem; text-transform: uppercase;
    letter-spacing: .12em; color: var(--faint); padding: .5rem .7rem .25rem;
    position: sticky; top: 0; background: var(--surface);
  }
  .results .row { display: flex; align-items: baseline; gap: .5rem; width: 100%; text-align: left; padding: .28rem .7rem; font-size: .78rem; }
  .results .row.cur { background: var(--sel); }
  .results .row .rt { margin-left: auto; color: var(--faint); font-size: .68rem; font-family: ui-monospace, Menlo, monospace; }
  .results .none { padding: .6rem .7rem; color: var(--faint); font-size: .78rem; }

  .status { margin-left: auto; display: flex; align-items: center; gap: .55rem; font-size: .68rem; color: var(--faint); white-space: nowrap; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
  .dot.ok { background: var(--accent); }
  .dot.bad { background: var(--bad); }
  .dot.load { background: var(--ochre); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  @media (prefers-reduced-motion: reduce) { .dot.load { animation: none } }
  .iconbtn { padding: .25rem .45rem; border: 1px solid var(--hair-2); border-radius: 3px; font-size: .7rem; color: var(--muted); }
  .iconbtn:hover { color: var(--accent); border-color: var(--accent); }

  /* ---- shell ---- */
  .split { display: grid; grid-template-columns: 15rem minmax(0, 1fr); min-height: 0; }
  @media (max-width: 60rem) {
    .split { grid-template-columns: minmax(0, 1fr); }
    aside { display: none; }
    aside.show { display: flex; position: absolute; inset: 3rem 0 0; z-index: 30; }
  }
  aside { border-right: 1px solid var(--hair); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
  .nav { padding: .5rem .4rem; border-bottom: 1px solid var(--hair); display: flex; flex-direction: column; gap: 1px; }
  .nav button {
    text-align: left; padding: .3rem .55rem; border-radius: 3px; font-size: .78rem; color: var(--muted);
    display: flex; align-items: baseline; gap: .5rem;
  }
  .nav button .n { margin-left: auto; font-size: .66rem; color: var(--faint); font-variant-numeric: tabular-nums; font-family: ui-monospace, Menlo, monospace; }
  .nav button:hover { background: var(--ground); color: var(--ink); }
  .nav button.on { background: var(--sel); color: var(--accent); }
  .nav button.on .n { color: var(--accent); }
  .railbody { overflow-y: auto; flex: 1; padding: .3rem 0 2rem; }
  .railhdr {
    font-family: ui-monospace, Menlo, monospace; font-size: .6rem; text-transform: uppercase;
    letter-spacing: .12em; color: var(--faint); padding: .7rem .6rem .25rem;
    position: sticky; top: 0; background: var(--surface); z-index: 1;
  }
  .rl {
    display: grid; grid-template-columns: 1fr auto; gap: .5rem; align-items: baseline; width: 100%;
    text-align: left; padding: .18rem .6rem; font-family: ui-monospace, Menlo, monospace;
    font-size: .72rem; color: var(--muted); border-left: 2px solid transparent; overflow-wrap: anywhere;
  }
  .rl:hover { background: var(--ground); color: var(--ink); }
  .rl.on { background: var(--sel); color: var(--accent); border-left-color: var(--accent); }
  .rl .n { font-size: .66rem; color: var(--faint); font-variant-numeric: tabular-nums; }
  .rl.on .n { color: var(--accent); }

  main { overflow-y: auto; min-height: 0; }
  .pad { padding: 1.4rem 1.6rem 6rem; max-width: 66rem; }
  @media (max-width: 60rem) { .pad { padding: 1rem .9rem 5rem; } }

  /* ---- type ---- */
  h1 { font-family: ui-monospace, Menlo, monospace; font-size: 1.5rem; font-weight: 600; letter-spacing: -.02em; margin: 0; line-height: 1.15; }
  h2 { font-family: ui-monospace, Menlo, monospace; font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .14em; margin: 0 0 .7rem; padding-bottom: .4rem; border-bottom: 1px solid var(--hair-2); }
  h3 { font-family: ui-monospace, Menlo, monospace; font-size: .66rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0 0 .45rem; }
  p { margin: 0 0 .7rem; max-width: 46rem; color: var(--muted); }
  p:last-child { margin-bottom: 0; }
  .lead { font-size: .93rem; }
  .crumb { display: flex; align-items: center; gap: .4rem; font-family: ui-monospace, Menlo, monospace; font-size: .68rem; color: var(--faint); margin-bottom: .5rem; }
  .crumb a { color: var(--muted); text-decoration: none; }
  .crumb a:hover { color: var(--accent); }
  .block { margin-top: 1.5rem; }
  .headline { display: flex; flex-wrap: wrap; align-items: baseline; gap: .6rem; margin-bottom: .6rem; }
  .tag { font-family: ui-monospace, Menlo, monospace; font-size: .62rem; text-transform: uppercase; letter-spacing: .09em; padding: .1rem .4rem; border: 1px solid var(--hair-2); border-radius: 2px; color: var(--muted); white-space: nowrap; }
  .tag.k { color: var(--accent); border-color: var(--accent); background: var(--accent-w); }
  /* Vanilla is a COVERED state — no rules text is read completely and correctly, and it is a fifth
     of the corpus. It reads as accent, hollow rather than filled, so it is legible as "covered, by
     a different route" instead of being mistaken for a decline. */
  .tag.v { color: var(--accent); border-color: var(--accent); background: transparent; }
  .tag.w { color: var(--ochre); border-color: var(--ochre); background: var(--ochre-w); }
  .tag.b { color: var(--bad); border-color: var(--bad); background: var(--bad-w); }
  .empty { color: var(--faint); padding: 1.1rem; border: 1px dashed var(--hair-2); border-radius: 3px; font-size: .82rem; }

  /* ---- the sweep placeholder ----
     The fill is a real fraction — bytes of the bulk file the stream has pulled, see OracleCorpus.cards
     — so the width transitions over the 700ms poll interval rather than stepping, and the sheen only
     says "still moving" on top of it. The card count beside it is exact; the percentage is of the
     file, which is why the two are labelled separately rather than implying a card total nobody has. */
  .sweep { border: 1px solid var(--hair); background: var(--surface); box-shadow: var(--shadow); border-radius: 3px; overflow: hidden; }
  .sweep .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem 1rem; padding: .85rem 1rem .7rem; }
  .sweep .ttl { font-family: ui-monospace, Menlo, monospace; font-size: .66rem; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
  .sweep .ttl.b { color: var(--bad); }
  .sweep .cnt2 { margin-left: auto; font-size: .7rem; color: var(--faint); font-family: ui-monospace, Menlo, monospace; }
  .sweep .cnt2 b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .sweep .rail { position: relative; margin: 0 1rem; height: 6px; background: var(--sunken); border-radius: 1px; overflow: hidden; }
  .sweep .rail i {
    display: block; height: 100%; width: 0; background: var(--accent);
    transition: width .7s linear; position: relative; overflow: hidden;
  }
  .sweep .rail i::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.55) 50%, transparent 100%);
    background-size: 40% 100%; background-repeat: no-repeat;
    animation: sweepsheen 1.4s ease-in-out infinite;
  }
  @keyframes sweepsheen { 0% { background-position: -50% 0 } 100% { background-position: 150% 0 } }
  /* Nothing known yet — the first tick has not landed — so the bar travels instead of filling. */
  .sweep .rail.ind i { width: 34%; animation: sweeptravel 1.6s cubic-bezier(.45,.05,.55,.95) infinite; transition: none; }
  @keyframes sweeptravel { 0% { transform: translateX(-110%) } 100% { transform: translateX(310%) } }
  .sweep .pct { padding: .45rem 1rem 1rem; font-family: ui-monospace, Menlo, monospace; font-size: .66rem; color: var(--faint); font-variant-numeric: tabular-nums; }
  .sweep .foot2 { border-top: 1px solid var(--hair); background: var(--sunken); padding: .6rem 1rem; font-size: .74rem; color: var(--muted); }
  .sweep .foot2 p { margin: 0; font-size: .74rem; }
  @media (prefers-reduced-motion: reduce) {
    .sweep .rail i::after { animation: none; background: none; }
    .sweep .rail.ind i { animation: none; width: 100%; opacity: .35; }
  }

  /* ---- stats ---- */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr)); gap: 1px; background: var(--hair); border: 1px solid var(--hair); }
  .stat { background: var(--surface); padding: .75rem .85rem; }
  .stat .v { font-family: ui-monospace, Menlo, monospace; font-size: 1.3rem; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; display: block; }
  .stat .v.ok { color: var(--accent); } .stat .v.bad { color: var(--bad); }
  .stat .k { display: block; font-size: .61rem; text-transform: uppercase; letter-spacing: .09em; color: var(--faint); }
  .stat .s { display: block; margin-top: .15rem; font-size: .66rem; color: var(--faint); font-family: ui-monospace, Menlo, monospace; }

  /* ---- tables ---- */
  .tablewrap { overflow-x: auto; border: 1px solid var(--hair); background: var(--surface); box-shadow: var(--shadow); }
  table { border-collapse: collapse; width: 100%; font-size: .78rem; }
  th { text-align: left; font-family: ui-monospace, Menlo, monospace; font-size: .61rem; text-transform: uppercase; letter-spacing: .1em; color: var(--faint); font-weight: 500; padding: .45rem .7rem; border-bottom: 1px solid var(--hair); background: var(--sunken); white-space: nowrap; }
  td { padding: .3rem .7rem; border-bottom: 1px solid var(--hair); vertical-align: baseline; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--ground); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: ui-monospace, Menlo, monospace; }
  td.nm { font-family: ui-monospace, Menlo, monospace; }
  td.nm a { text-decoration: none; }
  td.nm a:hover { text-decoration: underline; }
  .clickrow { cursor: pointer; }

  .meter { display: inline-block; width: 6rem; height: 6px; background: var(--sunken); border-radius: 1px; overflow: hidden; vertical-align: middle; }
  .meter i { display: block; height: 100%; background: var(--accent); }
  .meter i.split { background: var(--ochre); }

  /* ---- corpus bar: the whole corpus in one row, by card state ---- */
  .corpus { display: flex; height: 2.4rem; border: 1px solid var(--hair); background: var(--surface); overflow: hidden; }
  .corpus button { position: relative; min-width: 2px; transition: filter .12s; }
  .corpus button:hover { filter: brightness(1.25); }
  .corpus .s-round-trip { background: var(--accent); }
  .corpus .s-vanilla    { background: var(--accent); opacity: .42; }
  .corpus .s-variant    { background: var(--ochre); }
  .corpus .s-declined   { background: var(--sunken); }
  .corpuskey { display: flex; flex-wrap: wrap; gap: .1rem 1.1rem; margin-top: .5rem; font-size: .72rem; }
  .corpuskey button { display: flex; align-items: baseline; gap: .35rem; color: var(--muted); }
  .corpuskey button:hover { color: var(--ink); }
  .corpuskey .sw { width: .6rem; height: .6rem; border-radius: 1px; flex: none; align-self: center; }
  .corpuskey .sw.s-round-trip { background: var(--accent); }
  .corpuskey .sw.s-vanilla    { background: var(--accent); opacity: .42; }
  .corpuskey .sw.s-variant    { background: var(--ochre); }
  .corpuskey .sw.s-declined   { background: var(--hair-2); }
  .corpuskey .nn { font-family: ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; color: var(--ink); }
  .corpuskey .pp { color: var(--faint); font-family: ui-monospace, Menlo, monospace; }

  /* ---- unlock curve ---- */
  .curve { border: 1px solid var(--hair); background: var(--surface); padding: .8rem .9rem .5rem; }
  .curve svg { display: block; width: 100%; height: 7rem; overflow: visible; }
  .curve .area { fill: var(--accent); opacity: .16; }
  .curve .line { fill: none; stroke: var(--accent); stroke-width: 1.5; }
  .curve .base { stroke: var(--hair-2); stroke-width: 1; stroke-dasharray: 3 3; }
  .curve .mk { stroke: var(--hair-2); stroke-width: 1; }
  .curve text { font-family: ui-monospace, Menlo, monospace; font-size: 9px; fill: var(--faint); }

  /* ---- rows / toolbar ---- */
  .toolrow { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; margin-bottom: .7rem; }
  .toolrow input, .toolrow select {
    font-family: ui-monospace, Menlo, monospace; font-size: .74rem; padding: .28rem .5rem;
    border: 1px solid var(--hair-2); border-radius: 3px; background: var(--surface); color: var(--ink);
  }
  .toolrow input.grow { flex: 1; min-width: 11rem; }
  .seg { display: flex; border: 1px solid var(--hair-2); border-radius: 3px; overflow: hidden; }
  .seg button { padding: .26rem .5rem; font-size: .68rem; font-family: ui-monospace, Menlo, monospace; color: var(--muted); }
  .seg button.on { background: var(--accent-w); color: var(--accent); }
  .cnt { font-size: .68rem; color: var(--faint); font-variant-numeric: tabular-nums; font-family: ui-monospace, Menlo, monospace; margin-left: auto; }
  .chip { font-size: .68rem; padding: .16rem .42rem; border: 1px solid var(--hair-2); border-radius: 2px; color: var(--muted); background: var(--surface); text-decoration: none; display: inline-block; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--surface); }
  .chips { display: flex; flex-wrap: wrap; gap: .28rem; }
  .primary { background: var(--accent); color: #fff; padding: .32rem .8rem; border-radius: 3px; font-size: .78rem; }
  :root:not([data-theme="light"]) .primary { color: #0E1114; }

  /* ---- card page ---- */
  .sxs { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.25fr); gap: 1.2rem; align-items: start; }
  @media (max-width: 60rem) { .sxs { grid-template-columns: minmax(0,1fr); } }
  .face { border: 1px solid var(--hair); background: var(--surface); padding: .7rem .8rem; margin-bottom: .7rem; box-shadow: var(--shadow); }
  .fname { display: flex; justify-content: space-between; gap: .6rem; font-weight: 600; font-family: ui-monospace, Menlo, monospace; font-size: .84rem; }
  .ftype { color: var(--muted); font-size: .74rem; margin: .1rem 0 .5rem; font-family: ui-monospace, Menlo, monospace; }
  .ftext p { color: var(--ink); font-size: .82rem; margin: 0 0 .35rem; }
  .pip { display: inline-block; min-width: 1.05em; padding: 0 .18em; text-align: center; border-radius: 1em; background: var(--sunken); color: var(--ink); font-size: .68rem; font-family: ui-monospace, Menlo, monospace; line-height: 1.5; }

  .line { border: 1px solid var(--hair); background: var(--surface); margin-bottom: .55rem; box-shadow: var(--shadow); }
  .line > .head { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: .6rem; align-items: baseline; padding: .4rem .7rem; border-bottom: 1px solid var(--hair); }
  .line.rt > .head { border-left: 2px solid var(--accent); }
  .line.va > .head { border-left: 2px solid var(--ochre); }
  .line.de > .head { border-left: 2px solid var(--hair-2); }
  .line.er > .head { border-left: 2px solid var(--bad); }
  .line .lt { font-family: ui-monospace, Menlo, monospace; font-size: .78rem; overflow-wrap: anywhere; }
  .line .body { padding: .5rem .7rem; display: flex; flex-direction: column; gap: .5rem; }
  .kv { display: grid; grid-template-columns: 5.5rem minmax(0,1fr); gap: .5rem; font-size: .74rem; }
  .kv .k { color: var(--faint); font-family: ui-monospace, Menlo, monospace; font-size: .62rem; text-transform: uppercase; letter-spacing: .08em; padding-top: .12rem; }
  pre.code { margin: 0; font-size: .72rem; background: var(--sunken); padding: .5rem .6rem; border-radius: 3px; overflow-x: auto; white-space: pre; color: var(--ink); }
  pre.caret { margin: 0; font-size: .74rem; background: var(--sunken); padding: .5rem .6rem; border-radius: 3px; overflow-x: auto; white-space: pre; color: var(--muted); }
  pre.caret b { color: var(--bad); font-weight: 600; }
  .struct { font-family: ui-monospace, Menlo, monospace; font-size: .73rem; overflow-wrap: anywhere; }
  .struct .d { color: var(--faint); }

  details.raw { margin-top: .3rem; }
  details.raw summary { font-size: .68rem; color: var(--faint); cursor: pointer; font-family: ui-monospace, Menlo, monospace; }

  .form { display: flex; flex-direction: column; gap: .5rem; }
  .form label { display: flex; flex-direction: column; gap: .2rem; font-size: .66rem; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-family: ui-monospace, Menlo, monospace; }
  .form input, .form textarea {
    font-family: ui-monospace, Menlo, monospace; font-size: .78rem; padding: .35rem .5rem;
    border: 1px solid var(--hair-2); border-radius: 3px; background: var(--surface); color: var(--ink);
    text-transform: none; letter-spacing: normal;
  }
  .form .pair { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }

  /* ---- AI reading ----
     What the engine AI's static readers understand, one row per ability. Read is the accent with a
     check; a gap is ochre with a cross — never colour alone, and never the "bad" red, because an
     unread effect is work to do rather than a bug. A static ability nobody asks about is hollow. */
  .ai-sum { display: inline-flex; align-items: center; gap: .3rem; }
  button.ai-sum { cursor: pointer; font-family: ui-monospace, Menlo, monospace; font-size: .62rem; }
  button.ai-sum:hover { filter: brightness(.92); }
  .ai-sum.ok { color: var(--accent); border-color: var(--accent); background: var(--accent-w); }
  .ai-sum.gap { color: var(--ochre); border-color: var(--ochre); background: var(--ochre-w); }
  .ai-sum.wait { color: var(--faint); }
  .ai-sum .dot { width: 5px; height: 5px; }
  .aiab { border: 1px solid var(--hair); background: var(--surface); margin-bottom: .45rem; box-shadow: var(--shadow); }
  .aiab > .head { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: .55rem; align-items: baseline; padding: .4rem .7rem; }
  .aiab.ok > .head { border-left: 2px solid var(--accent); }

  .aiab .ttl { font-family: ui-monospace, Menlo, monospace; font-size: .64rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); white-space: nowrap; }
  .aiab .txt { font-size: .78rem; overflow-wrap: anywhere; }
  .aiab.na .txt { color: var(--muted); }
  .aiab .fs { border-top: 1px solid var(--hair); padding: .35rem .7rem .45rem; display: flex; flex-direction: column; gap: .3rem; }

  .aif.gap .why { color: var(--ink); font-weight: 500; }
  .aif .dev { display: block; font-family: ui-monospace, Menlo, monospace; font-size: .66rem; color: var(--faint); overflow-wrap: anywhere; }
  .aif .dev q { color: var(--muted); quotes: "\201C" "\201D"; }
  .ic { display: inline-flex; align-items: center; justify-content: center; width: 1rem; height: 1rem; border-radius: 50%; font-size: .62rem; font-weight: 700; line-height: 1; flex: none; margin-top: .08rem; }
  .ic.ok { color: var(--accent); background: var(--accent-w); border: 1px solid var(--accent); }
  .ic.gap { color: var(--ochre); background: var(--ochre-w); border: 1px solid var(--ochre); }
  .ic.na { color: var(--faint); border: 1px dashed var(--hair-2); }
  .aikey { display: flex; flex-wrap: wrap; gap: .2rem 1rem; font-size: .7rem; color: var(--muted); margin: .1rem 0 .6rem; align-items: center; }
  .aikey span { display: inline-flex; align-items: center; gap: .3rem; }
  .callout.preview { border-left-color: var(--ochre); margin: 0 0 .7rem; }
  .callout.preview .h { color: var(--ochre); }
  .aiwait { display: flex; align-items: center; gap: .5rem; color: var(--faint); font-size: .78rem; padding: 1rem; border: 1px dashed var(--hair-2); border-radius: 3px; }
  td.ai { text-align: center; }

  /* ---- AI rating ----
     Two numbers, each drawn rather than printed: the limited pick rating on its 0–5 scale with the
     band zones the scorer's cutoffs carve (bomb at 3.9), and the board value on the evaluator's own
     points with a few familiar cards marked for scale. Below each, a waterfall — one row per part of
     the card, each bar starting where the last ended — so what makes the number is visible at a
     glance. Gains are the accent, a drawback ochre; the total row is solid. */
  .rgrid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 1rem; align-items: start; }
  @media (max-width: 60rem) { .rgrid { grid-template-columns: minmax(0,1fr); } }
  .rcard { border: 1px solid var(--hair); background: var(--surface); box-shadow: var(--shadow); padding: .8rem .9rem .9rem; min-width: 0; }
  .rcard > h3 { margin: 0 0 .55rem; font-family: ui-monospace, Menlo, monospace; font-size: .64rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .rhead { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; margin-bottom: .55rem; }
  .rnum { font-family: ui-monospace, Menlo, monospace; font-size: 1.9rem; font-weight: 600; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .rnum small { font-size: .78rem; font-weight: 400; color: var(--faint); margin-left: .35rem; letter-spacing: 0; }
  .rband { font-family: ui-monospace, Menlo, monospace; font-size: .62rem; text-transform: uppercase; letter-spacing: .09em; padding: .12rem .45rem; border-radius: 2px; border: 1px solid currentColor; }
  .rband[data-b="0"] { color: var(--faint); }
  .rband[data-b="1"] { color: var(--muted); }
  .rband[data-b="2"], .rband[data-b="3"] { color: var(--accent); }
  .rband[data-b="4"] { color: var(--accent); background: var(--accent-w); font-weight: 600; }
  .rsrc { font-size: .76rem; color: var(--muted); margin: .55rem 0 0; }
  .rsrc b { color: var(--ink); font-weight: 500; }

  .gauge { position: relative; padding-top: 1.15rem; margin: .1rem 0 .1rem; }
  .gauge .track { display: flex; height: .55rem; border-radius: 2px; overflow: hidden; }
  .gauge .zone { height: 100%; border-right: 1px solid var(--surface); }
  .gauge .zone:last-child { border-right: 0; }
  .gauge .zones { display: flex; margin-top: .25rem; }
  .gauge .zones span { font-family: ui-monospace, Menlo, monospace; font-size: .56rem; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); text-align: center; overflow: hidden; white-space: nowrap; text-overflow: clip; }
  .gauge .zones span.on { color: var(--ink); font-weight: 600; }
  .gauge .mk { position: absolute; top: 0; bottom: 1.05rem; width: 0; transform: translateX(-50%); }
  .gauge .mk::before { content: ""; position: absolute; left: -1px; top: .95rem; bottom: -.2rem; width: 2px; background: var(--ink); border-radius: 1px; }
  .gauge .mk span { position: absolute; top: 0; left: 50%; transform: translateX(-50%); font-family: ui-monospace, Menlo, monospace; font-size: .6rem; font-weight: 600; white-space: nowrap; color: var(--ink); }
  .gauge .mk.ghost::before { background: none; border-left: 2px dotted var(--faint); left: -1px; width: 0; }
  .gauge .mk.ghost span { color: var(--faint); font-weight: 400; }
  .gauge .mk.ref::before { background: var(--hair-2); width: 1px; left: 0; top: 1.05rem; }
  .gauge .mk.ref span { color: var(--faint); font-weight: 400; font-size: .56rem; }
  .gauge.plain { padding-bottom: .95rem; }
  .gauge.plain .mk { bottom: 0; }
  .gauge.plain .mk::before { bottom: .75rem; }
  .gauge.plain .mk.ref::before { top: 1.15rem; bottom: .8rem; }
  .gauge.plain .mk.ref span { top: auto; bottom: 0; }
  .gauge .mk.edge-l span { left: 0; transform: none; }
  .gauge .mk.edge-r span { left: auto; right: 0; transform: none; }

  .wf { margin-top: .75rem; display: flex; flex-direction: column; gap: .18rem; }
  .wf .wh { font-family: ui-monospace, Menlo, monospace; font-size: .6rem; text-transform: uppercase; letter-spacing: .09em; color: var(--faint); margin-bottom: .15rem; display: flex; justify-content: space-between; gap: .5rem; }
  .wrow { display: grid; grid-template-columns: minmax(5.5rem, 9rem) minmax(0,1fr) 3.1rem; gap: .55rem; align-items: center; font-size: .72rem; }
  .wrow .wl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
  .wrow .wl .d { color: var(--faint); }
  .wrow .wt { position: relative; height: .7rem; background: var(--sunken); border-radius: 2px; }
  .wrow .wt i { position: absolute; top: 0; bottom: 0; border-radius: 2px; background: var(--accent); opacity: .78; }
  .wrow .wt i.neg { background: var(--ochre); }
  .wrow .wv { font-family: ui-monospace, Menlo, monospace; font-size: .68rem; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .wrow.tot { border-top: 1px solid var(--hair); padding-top: .3rem; margin-top: .15rem; }
  .wrow.tot .wl { font-weight: 600; }
  .wrow.tot .wt i { opacity: 1; }
  .wrow.tot .wv { color: var(--ink); font-weight: 600; }
  .wrow .wt .cap { position: absolute; top: -.15rem; bottom: -.15rem; width: 0; border-left: 1px dashed var(--faint); }

  .psets { margin-top: .75rem; display: flex; flex-direction: column; gap: .2rem; }
  .pset { display: grid; grid-template-columns: 3.6rem minmax(0,1fr) 2.4rem 8.5rem; gap: .55rem; align-items: center; font-size: .72rem; }
  .pset .sc { font-family: ui-monospace, Menlo, monospace; font-size: .66rem; font-weight: 600; }
  .pset .bar { height: .4rem; background: var(--sunken); border-radius: 2px; position: relative; }
  .pset .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 2px; }
  .pset .bar i.fb { background: repeating-linear-gradient(135deg, var(--accent) 0 3px, transparent 3px 5px); opacity: .8; }
  .pset .v { font-family: ui-monospace, Menlo, monospace; font-size: .68rem; text-align: right; font-variant-numeric: tabular-nums; }
  .pset .tags { display: flex; gap: .25rem; flex-wrap: wrap; }
  .pset .tag { font-size: .54rem; padding: 0 .3rem; }

  .itags { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .75rem; }
  .itag { font-size: .7rem; padding: .12rem .5rem; border-radius: 999px; background: var(--accent-w); color: var(--accent); border: 1px solid transparent; }
  .itag.sp { background: transparent; border-color: var(--hair-2); color: var(--muted); }
  .itag.none { background: var(--ochre-w); color: var(--ochre); font: inherit; font-size: .7rem; cursor: pointer; }
  .itag.none:hover { filter: brightness(.95); text-decoration: underline; }
  .ifacts { margin: .5rem 0 0; padding-left: 1rem; font-size: .74rem; color: var(--muted); }
  .ifacts li { margin: .1rem 0; }
  .rempty { font-size: .76rem; color: var(--muted); padding: .7rem .8rem; background: var(--sunken); border-radius: 3px; margin-top: .2rem; }
  .rlegend { display: flex; gap: .9rem; flex-wrap: wrap; font-size: .66rem; color: var(--faint); margin-top: .45rem; }
  .rlegend span { display: inline-flex; align-items: center; gap: .3rem; }
  .rlegend i { display: inline-block; width: .9rem; height: .4rem; border-radius: 2px; background: var(--accent); }
  .rlegend i.fb { background: repeating-linear-gradient(135deg, var(--accent) 0 3px, transparent 3px 5px); }

  .note { font-size: .72rem; color: var(--faint); }
  .callout { border-left: 2px solid var(--accent); background: var(--surface); padding: .6rem .8rem; margin-top: 1.2rem; }
  .callout .h { font-family: ui-monospace, Menlo, monospace; font-size: .64rem; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); display: block; margin-bottom: .25rem; }
  .callout p { font-size: .78rem; }
  .foot { margin-top: 2.5rem; padding-top: .8rem; border-top: 1px solid var(--hair); font-size: .7rem; color: var(--faint); }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><button id="home">assay</button><span class="sub">explorer</span></div>
    <div class="searchwrap">
      <span class="mag">&#x2315;</span>
      <input id="q" type="text" autocomplete="off" spellcheck="false"
             placeholder="a card name, or a decline family&hellip;" aria-label="Search">
      <span class="kbd">/</span>
      <div class="results" id="res"></div>
    </div>
    <div class="status">
      <span class="dot load" id="dot"></span><span id="stat">starting</span>
      <button class="iconbtn" id="menu" title="Toggle nav">&#x2261;</button>
    </div>
  </div>

  <div class="split">
    <aside id="rail">
      <div class="nav" id="nav"></div>
      <div class="railbody" id="railbody"></div>
    </aside>
    <main id="main"><div class="pad" id="view"></div></main>
  </div>
</div>

<script>
"use strict";

/* =========================== plumbing =========================== */

const el   = (id) => document.getElementById(id);
const esc  = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const fmt  = (n) => (n ?? 0).toLocaleString("en-US");
/* The gates report parts per thousand, per the assay this module is named for. The page converts
   to percent — two decimals, so a corpus of 34,882 cards still moves the number visibly. */
const pct  = (permil) => (permil / 10).toFixed(2) + "%";
const share = (part, whole) => whole ? (100 * part / whole).toFixed(2) + "%" : "0%";
const go   = (hash) => { location.hash = hash; };
const qs   = (o) => Object.entries(o).filter(([, v]) => v !== null && v !== undefined && v !== "")
                    .map(([k, v]) => k + "=" + encodeURIComponent(v)).join("&");

/* Where the handlers are mounted. Injected by whichever server served this page — "/api/" for
   `assay explore`, a prefixed path when game-server frames it — so no request path is hard-coded. */
const API = window.ASSAY_API_BASE;

async function api(path, params) {
  const url = API + path + (params ? "?" + qs(params) : "");
  const r = await fetch(url);
  if (!r.ok) throw new Error(path + " -> " + r.status);
  return await r.json();
}

async function post(path, body) {
  const r = await fetch(API + path, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error(path + " -> " + r.status);
  return await r.json();
}

/* The sweep runs in the background; every corpus-backed payload can come back as a placeholder. */
const indexing = (d) => d && d.indexing === true;

function indexingHTML(d) {
  if (d.error) return '<div class="sweep">' +
    '<div class="top"><span class="ttl b">The corpus sweep failed</span></div>' +
    '<div class="foot2"><p>' + esc(d.error) + '<br>' +
    'The live parser and the grammar tree do not need the corpus — ' +
    '<a href="#parse">parse some text</a> or <a href="#grammar">read the rules</a>.</p></div></div>';

  const html = '<div class="sweep">' +
    '<div class="top"><span class="ttl">Sweeping the corpus</span>' +
    '<span class="cnt2" role="status" aria-live="polite">' +
    '<b id="sweptn">' + fmt(Math.max(d.swept || 0, SWEEP.cards)) + '</b> cards read</span></div>' +
    '<div class="rail" id="sweeprail"><i id="sweepfill"></i></div>' +
    '<div class="pct" id="sweeppct"></div>' +
    '<div class="foot2"><p>This page refreshes itself when the sweep lands. Meanwhile ' +
    '<a href="#parse">the live parser</a> and <a href="#grammar">the grammar</a> are ready now, ' +
    'because neither needs the corpus.</p></div></div>';
  /* Painted from the same function the poll uses, one frame later so the fill's width transition has
     a 0 to animate from — a bar that appeared already full would never look like it was filling. */
  requestAnimationFrame(() => tickSweep(d.swept, d.progress));
  return html;
}

/**
 * The panel reads the status poll, so a placeholder left on screen keeps counting and filling.
 *
 * The freshest of the two numbers wins: a view rendered mid-sweep carries whatever the *view's* own
 * request saw, which is a poll or two behind by the time the panel paints, and a bar that stepped
 * backwards on every navigation would look broken rather than late.
 */
const SWEEP = { cards: 0, fraction: 0 };

function tickSweep(cards, progress) {
  SWEEP.cards = Math.max(SWEEP.cards, cards || 0);
  SWEEP.fraction = Math.max(SWEEP.fraction, typeof progress === "number" ? progress : 0);

  const count = el("sweptn");
  if (count) count.textContent = fmt(SWEEP.cards);
  const rail = el("sweeprail"), fill = el("sweepfill"), pct = el("sweeppct");
  if (!rail || !fill) return;
  const f = SWEEP.fraction;
  rail.className = f > 0 ? "rail" : "rail ind";
  fill.style.width = f > 0 ? (100 * f).toFixed(1) + "%" : "";
  if (pct) pct.textContent = f > 0 ? (100 * f).toFixed(0) + "% of the Oracle bulk read" : "reading the Oracle bulk";
}

/* =========================== status =========================== */

let READY = false, OVERVIEW = null;

async function pollStatus() {
  let d;
  try { d = await api("status"); } catch (e) { setStatus("bad", "server gone"); return; }
  if (d.error) { setStatus("bad", "sweep failed"); READY = false; return; }
  if (!d.ready) {
    setStatus("load", "indexing " + fmt(d.swept));
    tickSweep(d.swept, d.progress);
    setTimeout(pollStatus, 700);
    return;
  }
  const first = !READY;
  READY = true;
  OVERVIEW = await api("overview");
  setStatus(OVERVIEW.clean ? "ok" : "bad",
    fmt(OVERVIEW.cards) + " cards · " + (OVERVIEW.clean ? "gate clean" : "GATE RED"));
  buildNav();
  if (first) route();
}

function setStatus(cls, text) {
  el("dot").className = "dot " + cls;
  el("stat").textContent = text;
}

/* =========================== nav =========================== */

const SECTIONS = [
  ["", "Overview", () => null],
  ["cards", "Cards", (o) => o && fmt(o.cards)],
  // The tail count, because that is the ranking the declines page opens on.
  ["declines", "Declines", (o) => o && fmt(o.tailFamilies)],
  ["grammar", "Grammar", () => null],
  ["differential", "Differential", (o) => o && fmt(o.goldens)],
  ["parse", "Parse text", () => null],
];

function buildNav() {
  const here = (location.hash || "#").slice(1).split("/")[0];
  el("nav").innerHTML = SECTIONS.map(([id, label, count]) => {
    const n = count(OVERVIEW);
    return '<button data-go="#' + id + '"' + (id === here ? ' class="on"' : "") + ">" +
      esc(label) + (n ? '<span class="n">' + n + "</span>" : "") + "</button>";
  }).join("");
  for (const b of el("nav").querySelectorAll("[data-go]")) {
    b.onclick = () => { go(b.dataset.go); el("rail").classList.remove("show"); };
  }
}

function rail(header, rows) {
  el("railbody").innerHTML = rows.length
    ? '<div class="railhdr">' + esc(header) + "</div>" + rows.join("")
    : "";
  for (const b of el("railbody").querySelectorAll("[data-go]")) {
    b.onclick = () => { go(b.dataset.go); el("rail").classList.remove("show"); };
  }
}

/* =========================== routing =========================== */

window.addEventListener("hashchange", route);

/* The hash is sliced *before* decoding: a card can be named "Wax // Wane" and a decline family can
   be a whole sentence, so a decoded slash would split a segment that is not a segment boundary. */
function route() {
  const h = location.hash || "";
  el("main").scrollTop = 0;
  buildNav();
  // `#c/<name>/ai` opens the card scrolled to its AI reading — the Set Completion view's AI-gaps
  // list links there, since the gap is what the reader came to see.
  if (h.startsWith("#c/")) {
    const rest = h.slice(3);
    const toAi = rest.endsWith("/ai");
    viewCard(decodeURIComponent(toAi ? rest.slice(0, -3) : rest), toAi);
  }
  else if (h.startsWith("#d/")) {
    const rest = h.slice(3);
    const cut = rest.indexOf("/");
    const by = rest.slice(0, cut);
    viewDecline(RANKINGS.includes(by) ? by : "token", decodeURIComponent(rest.slice(cut + 1)));
  }
  else if (h.startsWith("#g/")) viewGrammar(decodeURIComponent(h.slice(3)));
  else if (h.startsWith("#cards")) {
    // `#cards/declined` is a link target from the overview's verdict table; arriving by it presets
    // the filter, and every later interaction owns the filter state instead of the hash.
    const preset = h.split("/")[1];
    if (preset !== undefined) { cardFilter.state = decodeURIComponent(preset); }
    cardFilter.offset = 0; cardFilter.rows = [];
    viewCards();
  }
  else if (h.startsWith("#declines")) viewDeclines();
  else if (h.startsWith("#grammar")) viewGrammar(null);
  else if (h.startsWith("#differential")) viewDifferential();
  else if (h.startsWith("#parse")) viewParse();
  else viewOverview();
}

/* =========================== overview =========================== */

async function viewOverview() {
  rail("", []);
  const d = OVERVIEW || await api("overview");
  if (indexing(d)) { el("view").innerHTML = introHTML() + indexingHTML(d); return; }

  const v = d.verdicts, bugs = v.MISMATCH + v.AMBIGUOUS + d.normalizationFailures.length + d.restoreFailures.length;

  el("view").innerHTML = introHTML() + `
    <div class="block">
      <h2>The corpus, by card</h2>
      ${corpusBar(d)}
    </div>

    <div class="stats" style="margin-top:1.4rem">
      <div class="stat"><span class="v ok">${share(d.cardsCovered, d.cards)}</span><span class="k">Cards fully covered</span>
        <span class="s">${fmt(d.cardsCovered)} / ${fmt(d.cards)}</span></div>
      <div class="stat"><span class="v">${pct(d.inScopeFineness)}</span><span class="k">Phase 1 target class</span>
        <span class="s">${fmt(d.inScopeCovered)} / ${fmt(d.inScopeCards)} cards</span></div>
      <div class="stat"><span class="v">${pct(d.fineness)}</span><span class="k">Lines round-tripped</span>
        <span class="s">${fmt(v.ROUND_TRIP)} / ${fmt(d.lineInstances)}</span></div>
      <div class="stat"><span class="v">${fmt(v.DECLINED)}</span><span class="k">Declined lines</span>
        <span class="s">${fmt(d.tailFamilies)} tail families</span></div>
      <div class="stat"><span class="v ${bugs ? "bad" : "ok"}">${fmt(bugs)}</span><span class="k">Must be zero</span>
        <span class="s">mismatch + ambiguity</span></div>
    </div>

    <div class="block">
      <h2>Every ability line, by verdict</h2>
      <div class="tablewrap"><table>
        <thead><tr><th>Verdict</th><th>Meaning</th><th class="num">Lines</th><th class="num">Share</th><th class="num">Unique</th><th></th></tr></thead>
        <tbody>
          ${verdictRow("ROUND_TRIP", "Printed back byte-for-byte.", d, "round-trip")}
          ${verdictRow("VARIANT", "Alternate spelling normalized; the model survived unchanged.", d, "variant")}
          ${verdictRow("DECLINED", "Not covered. Counted and ranked — not a bug.", d, "declined")}
          ${verdictRow("AMBIGUOUS", "Two rules, two models, one text. <b>Must be 0.</b>", d, null)}
          ${verdictRow("MISMATCH", "Printed something it does not read back. <b>Must be 0.</b>", d, null)}
        </tbody>
      </table></div>
      <p class="note" style="margin-top:.5rem">Normalization not invertible:
        <b>${d.normalizationFailures.length}</b> · full inverse not reproduced:
        <b>${d.restoreFailures.length}</b> · redundant readings (same model):
        <b>${fmt(d.redundantReadingLines)}</b> · reminder glosses:
        ${fmt(d.glosses.MATCHED || 0)} matched, ${fmt(d.glosses.DIFFERED || 0)} differed,
        ${fmt(d.glosses.UNGLOSSED || 0)} unglossed.</p>
    </div>

    ${bugList("Print mismatches", d.mismatches)}
    ${bugList("Ambiguities", d.ambiguities)}
    ${bugList("Normalization not invertible", d.normalizationFailures)}
    ${bugList("Full inverse not reproduced", d.restoreFailures)}

    <div class="block" id="topdeclines"></div>

    <div class="callout">
      <span class="h">Reading these numbers</span>
      <p>Fineness is parts per thousand, per the assay this module is named for — so 841.1‰ is
      84.1%. The percentage is printed beside it so neither reading can be the wrong one.</p>
      <p>A <b>decline is not a failure</b>. It is the product: unparseable text is counted and named
      rather than approximated, and the bottom of that list is a continuously-updated report of what
      <code>mtg-sdk</code> cannot yet express, ranked by cards blocked.</p>
    </div>

    <div class="foot">
      Corpus <code>${esc(d.corpusFile)}</code> · swept in ${(d.sweepMillis / 1000).toFixed(1)}s ·
      ${fmt(d.goldens)} hand-written goldens on disk. Numbers are the gate's own
      — this page reads <code>FinenessReport</code>, it does not recompute it.
    </div>`;

  for (const b of el("view").querySelectorAll(".corpus [data-state], .corpuskey [data-state]")) {
    b.onclick = () => go("#cards/" + b.dataset.state);
  }

  const dec = await api("declines", { by: "tail", limit: 12 });
  if (!indexing(dec)) {
    el("topdeclines").innerHTML = "<h2>Top declines, by the parse&rsquo;s tail</h2>" +
      '<p class="note" style="margin-bottom:.6rem">Keyed on the text from each decline onward — the ' +
      'construct that would have to exist for the line to get further. <b>Sole</b> is the cards a ' +
      'family is the <em>only</em> blocker of, which is the number a band delivers.</p>' +
      declineTable(dec.families, dec.goldensAvailable, dec.ranking, dec.hasUnlocks) +
      '<p class="note" style="margin-top:.5rem">' + fmt(dec.total) +
      ' tail families in all, against ' + fmt(dec.familyCounts.TOKEN) + ' keyed by the token they died ' +
      'on and ' + fmt(dec.familyCounts.SHAPE) + ' by whole sentence — ' +
      '<a href="#declines">all three rankings, and why they disagree</a>.</p>';
  }
}

/* The whole corpus as one row: four card states, to scale, each a link into the filtered table.
   Covered states are on the left so the boundary between "read" and "not read" is one edge. */
const STATE_ORDER = ["round-trip", "vanilla", "variant", "declined"];

function corpusBar(d) {
  const total = d.cards || 1;
  const seg = (s) => {
    const n = d.states[s] || 0;
    return '<button class="s-' + s + '" style="flex:' + n + ' 0 0" data-state="' + s + '" title="' +
      esc(s + " — " + fmt(n) + " cards, " + share(n, total) + ": " + STATE_NOTE[s]) + '"></button>';
  };
  const key = (s) => {
    const n = d.states[s] || 0;
    return '<button data-state="' + s + '"><span class="sw s-' + s + '"></span>' +
      esc(s) + ' <span class="nn">' + fmt(n) + '</span> <span class="pp">' + share(n, total) + "</span></button>";
  };
  return '<div class="corpus">' + STATE_ORDER.map(seg).join("") + "</div>" +
    '<div class="corpuskey">' + STATE_ORDER.map(key).join("") + "</div>" +
    '<p class="note" style="margin-top:.6rem">Three of these four are <b>covered</b>: a vanilla card ' +
    "has no rules text and is read completely, and a variant only had a spelling normalized. " +
    "Together that is <b>" + share(d.cardsCovered, total) + "</b> of Magic that <code>mtg-sdk</code> " +
    "can express and Assay can read back.</p>";
}

function introHTML() {
  return `
    <h1>Argentum Assay</h1>
    <p class="lead" style="margin-top:.5rem">A bidirectional Oracle-text grammar: Scryfall JSON in,
    <code>mtg-sdk</code> models out, with every rule written in <em>both</em> directions so the whole
    corpus proves it without a human reading the output. This page is that corpus, those rules, and
    both gates — served by the grammar that is on the classpath right now, so a rule you just
    edited is a restart away from being re-measured.</p>`;
}

function verdictRow(key, meaning, d, filter) {
  const n = d.verdicts[key] || 0, u = d.uniqueVerdicts[key] || 0;
  const pctWidth = d.lineInstances ? Math.round(100 * n / d.lineInstances) : 0;
  const cls = key === "ROUND_TRIP" ? "" : key === "VARIANT" ? "split" : "";
  const bad = (key === "AMBIGUOUS" || key === "MISMATCH") && n > 0;
  return `<tr${filter ? ' class="clickrow" onclick="go(\'#cards/' + filter + '\')"' : ""}>
    <td class="nm"><span class="tag ${bad ? "b" : key === "ROUND_TRIP" ? "k" : key === "VARIANT" ? "w" : ""}">${key}</span></td>
    <td style="color:var(--muted)">${meaning}</td>
    <td class="num">${fmt(n)}</td>
    <td class="num" style="color:var(--muted)">${share(n, d.lineInstances)}</td>
    <td class="num" style="color:var(--muted)">${fmt(u)}</td>
    <td><span class="meter"><i class="${cls}" style="width:${pctWidth}%"></i></span></td>
  </tr>`;
}

function bugList(title, items) {
  if (!items || !items.length) return "";
  return '<div class="block"><h2 style="color:var(--bad);border-color:var(--bad)">' + esc(title) +
    "</h2><ul>" + items.map((i) => '<li class="mono" style="font-size:.76rem">' + esc(i) + "</li>").join("") +
    "</ul></div>";
}

/* =========================== declines =========================== */

const RANKING_LABEL = { TOKEN: "Died on", SHAPE: "Sentence shape", TAIL: "Tail — what has to exist" };

function declineTable(families, showImplemented, ranking, showUnlocks) {
  const max = families.reduce((m, f) => Math.max(m, f.cards), 1);
  const by = (ranking || "TOKEN").toLowerCase();
  return '<div class="tablewrap"><table><thead><tr>' +
    "<th>" + (RANKING_LABEL[ranking] || "Died on") + "</th>" +
    '<th class="num" title="cards that mention it — how big the gap looks">Blocks</th>' +
    (showUnlocks ? '<th class="num" title="cards this is the ONLY remaining blocker of — write it and exactly this many become covered">Sole</th>' : "") +
    (showImplemented ? '<th class="num" title="of the blocked cards, how many already have a hand-written golden">Hand-written</th>' : "") +
    '<th class="num">Lines</th><th></th><th>Example line</th>' +
    "</tr></thead><tbody>" +
    families.map((f) => {
      const w = Math.round(100 * Math.sqrt(f.cards / max));
      const iw = f.cards ? Math.round(w * f.implemented / f.cards) : 0;
      const link = "#d/" + by + "/" + encodeURIComponent(f.key);
      return '<tr class="clickrow" onclick="go(\'' + link + "')\">" +
        '<td class="nm"><a href="' + link + '">' + esc(f.key.slice(0, 70)) + "</a></td>" +
        '<td class="num">' + fmt(f.cards) + "</td>" +
        (showUnlocks ? '<td class="num" style="color:' + (f.unlocks ? "var(--accent)" : "var(--faint)") + '">' +
          (f.unlocks ? fmt(f.unlocks) : "—") + "</td>" : "") +
        (showImplemented ? '<td class="num" style="color:var(--ochre)">' + fmt(f.implemented) + "</td>" : "") +
        '<td class="num" style="color:var(--muted)">' + fmt(f.lines) + "</td>" +
        '<td><span class="meter"><i style="width:' + w + '%"></i>' +
          (iw ? '<i class="split" style="width:' + iw + '%;margin-top:-6px"></i>' : "") + "</span></td>" +
        '<td class="mono" style="color:var(--muted);font-size:.73rem">' + esc((f.examples[0] || "").slice(0, 64)) + "</td>" +
        "</tr>";
    }).join("") +
    "</tbody></table></div>";
}

/* The ranked list as a plan: cards covered after implementing the top N families, cumulatively.
   A card joins only when its LAST remaining blocker is written, which is why this is far below the
   sum of the Blocks column and is the number worth planning against. */
function unlockCurve(curve, covered, total) {
  if (!curve || curve.length < 2) return "";
  const W = 640, H = 96, lo = covered, hi = curve[curve.length - 1];
  const span = Math.max(1, hi - lo);
  const x = (i) => (i / (curve.length - 1)) * W;
  const y = (n) => H - ((n - lo) / span) * H;
  const line = curve.map((n, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(n).toFixed(1)).join(" ");
  const marks = [10, 25, 50, 100, 200, curve.length].filter((n, i, a) => n <= curve.length && a.indexOf(n) === i);

  return `<div class="curve">
    <svg viewBox="0 -8 ${W} ${H + 22}" preserveAspectRatio="none" role="img"
         aria-label="cards covered after implementing the top N families">
      <path class="area" d="${line} L ${W} ${H} L 0 ${H} Z"></path>
      <path class="line" d="${line}"></path>
      <line class="base" x1="0" y1="${H}" x2="${W}" y2="${H}"></line>
      ${marks.map((n) => {
        const px = x(n - 1);
        return '<line class="mk" x1="' + px.toFixed(1) + '" y1="' + y(curve[n - 1]).toFixed(1) +
          '" x2="' + px.toFixed(1) + '" y2="' + H + '"></line>' +
          '<text x="' + px.toFixed(1) + '" y="' + (H + 14) + '" text-anchor="' +
          (n === curve.length ? "end" : "middle") + '">' + n + "</text>";
      }).join("")}
    </svg>
    <div class="corpuskey" style="margin-top:.6rem">
      ${marks.map((n) => '<span style="color:var(--muted);display:flex;gap:.35rem;align-items:baseline">top ' +
        n + ' <span class="nn">' + share(curve[n - 1], total) + '</span> <span class="pp">+' +
        fmt(curve[n - 1] - covered) + " cards</span></span>").join("")}
    </div>
    <p class="note" style="margin-top:.5rem">Cards <em>covered</em>, not cards mentioned: a card joins
    only when its last remaining blocker is written. That is why this curve sits far below the sum of
    the <b>Blocks</b> column — and it is the number to plan against.</p>
  </div>`;
}

const RANKINGS = ["token", "shape", "tail"];
let declineQuery = "", declineBy = "tail";

async function viewDeclines() {
  const d = await api("declines", { by: declineBy, q: declineQuery, limit: 250 });
  if (indexing(d)) { el("view").innerHTML = indexingHTML(d); return; }
  const seg = (by, label) => '<button data-by="' + by + '"' +
    (d.ranking === by.toUpperCase() ? ' class="on"' : "") + ">" + label + " · " +
    fmt(d.familyCounts[by.toUpperCase()]) + "</button>";

  el("view").innerHTML = `
    <div class="crumb"><a href="#">overview</a> <span>/</span> <span>declines</span></div>
    <h1>What the grammar refuses</h1>
    <p class="lead" style="margin-top:.5rem">Every declined line, ranked by cards blocked. This is the
    module's primary product: a decline names a missing capability in Argentum's own vocabulary rather
    than in a third ontology's.</p>
    <p>The three rankings answer <em>different questions</em> and they disagree in ways that change the
    work. <b>Died on</b> keys each line by the token its parse stopped at — the right key for "what is
    the grammar missing", and the wrong one for choosing a band: a line dies at its <em>first</em>
    unknown token, so one missing verb scatters across several buckets and a missing prefix looks
    larger than it is. <b>Sentence shape</b> keys it by the whole line with numbers and symbols
    collapsed, which aggregates a family whose sentence <em>is</em> the whole line — every printing of
    <code>Choose one —</code> is one row — and shatters one whose sentence continues into an arbitrary
    payload, because each payload gets its own row.</p>
    <p><b>Tail</b> is the one that has decided work. It keys on the text from the decline's own offset
    onward: not the token it stopped at and not the sentence it sits in, but <em>the construct that
    would have to exist for the line to get further</em>. The spell-cast triggers are the worked
    example — 504 cards sole-blocked, more than twice the next family, and neither other ranking
    showed it. Died-on smeared them across <code>you</code>, which "whenever you gain life" also dies
    at; sentence shape split them into hundreds of rows of one to six cards.</p>
    <p><b>Implemented</b> is the other split worth working from. A declined line on a card that already
    has a hand-written golden is a <em>grammar</em> gap whose known-good answer is already written, and
    the differential confirms it the moment it parses. A declined line on a card nobody has implemented
    may be an <em>SDK</em> gap, which is far longer work.</p>
    <div class="toolrow" style="margin-top:1.1rem">
      <div class="seg">
        ${seg("tail", "tail")}${seg("shape", "sentence shape")}${seg("token", "died on")}
      </div>
      <input id="df" class="grow" placeholder="filter…" value="${esc(declineQuery)}"
             autocomplete="off" spellcheck="false">
      <span class="cnt">${fmt(d.matching)} of ${fmt(d.total)} · ${fmt(d.declinedLines)} lines</span>
    </div>
    <div class="block" style="margin-top:0">
      <h2>What working the top of this list buys</h2>
      ${d.hasUnlocks ? unlockCurve(d.unlockCurve, d.cardsCovered, d.corpusCards) : `<div class="empty">
        There is no such number for this ranking, and that is the point. A curve like this is a claim
        about <em>work</em> — write the top N and that many cards become covered — and a dead token is
        not a unit of work: a line stops at its <em>first</em> unknown token, so "every declined line
        of this card died at <code>Whenever</code>" says nothing has been read and implies no rule.
        Computing it anyway claimed the top 400 token families cover 93% of Magic, against 15% for the
        top 400 sentence shapes. <button class="linky" style="color:var(--accent)" data-by="tail">Switch
        to the tail</button> to see the honest one.</div>`}
    </div>
    <div class="block">
    ${d.families.length ? declineTable(d.families, d.goldensAvailable, d.ranking, d.hasUnlocks)
                        : '<div class="empty">Nothing matches that filter.</div>'}
    ${d.matching > d.families.length ? '<p class="note" style="margin-top:.5rem">Showing the first ' +
      fmt(d.families.length) + '. Narrow the filter to see further down.</p>' : ""}
    </div>`;

  // Covers the seg toggle and the "switch to sentence shape" link inside the empty-curve note.
  for (const b of el("view").querySelectorAll("[data-by]")) {
    b.onclick = () => { declineBy = b.dataset.by; viewDeclines(); };
  }
  const input = el("df");
  let timer = null;
  input.oninput = () => {
    declineQuery = input.value;
    clearTimeout(timer);
    timer = setTimeout(() => { const at = input.selectionStart; viewDeclines().then(() => {
      const next = el("df"); if (next) { next.focus(); next.setSelectionRange(at, at); }
    }); }, 200);
  };

  rail("Top families", d.families.slice(0, 60).map((f) =>
    '<button class="rl" data-go="#d/' + declineBy + "/" + encodeURIComponent(f.key) +
    '"><span>' + esc(f.key.slice(0, 44)) + '</span><span class="n">' + fmt(f.cards) + "</span></button>"));
}

const DECLINE_BLURB = {
  TAIL: (d) => "The text from each decline's own offset onward — <em>the construct that would have to " +
    "exist for these " + fmt(d.lines) + " lines to get further</em>. That is what makes this a piece of " +
    "work rather than a bucket: everything before it already reads, and everything after it is the " +
    "payload the rest of the grammar may or may not already handle. Which of those it is, is the " +
    "question the probe below answers.",
  SHAPE: (d) => "Every line of this shape, with numbers and mana symbols collapsed. They are one row " +
    "because one rule would read all " + fmt(d.lines) + " of them.",
  TOKEN: (d) => "Every one of these lines parsed as far as this token and stopped. They are one family " +
    "because they died in the same place, which is what makes them one piece of work rather than " +
    fmt(d.cards) + ".",
};
const DECLINE_TAG = { TAIL: "parse tail", SHAPE: "sentence shape", TOKEN: "decline family" };

async function viewDecline(by, key) {
  const d = await api("decline", { by, key });
  if (indexing(d)) { el("view").innerHTML = indexingHTML(d); return; }
  if (d.error) { el("view").innerHTML = '<div class="empty">' + esc(d.error) + "</div>"; return; }

  el("view").innerHTML = `
    <div class="crumb"><a href="#">overview</a> <span>/</span> <a href="#declines">declines</a></div>
    <div class="headline"><h1 style="font-size:1.1rem">${esc(d.key)}</h1>
      <span class="tag">${DECLINE_TAG[d.ranking] || "decline family"}</span></div>
    <p>${DECLINE_BLURB[d.ranking](d)}</p>

    <div class="stats" style="margin-top:1rem">
      <div class="stat"><span class="v">${fmt(d.cards)}</span><span class="k">Cards blocked</span>
        <span class="s">how big it looks</span></div>
      ${d.hasUnlocks ? `<div class="stat"><span class="v ok">${fmt(d.unlocks)}</span>
        <span class="k">Sole-blocked</span><span class="s">the only thing blocking them</span></div>` : ""}
      <div class="stat"><span class="v">${fmt(d.lines)}</span><span class="k">Lines</span></div>
      <div class="stat"><span class="v" style="color:var(--ochre)">${fmt(d.implemented)}</span>
        <span class="k">Already hand-written</span><span class="s">grammar gap, not SDK gap</span></div>
    </div>
    ${d.hasUnlocks ? '<p class="note" style="margin-top:.6rem">The other ' + fmt(d.cards - d.unlocks) +
      " cards decline on something else as well, so writing this alone does not cover them — it is " +
      "still progress on every one of them, just not the whole of any.</p>" : ""}

    ${probeHTML(d)}

    <div class="block">
      <h2>Example lines</h2>
      <div class="tablewrap"><table><tbody>${d.examples.map((e) =>
        '<tr><td class="mono" style="font-size:.76rem">' + esc(e) + "</td></tr>").join("")}</tbody></table></div>
    </div>

    <div class="block">
      <h2>Cards behind it</h2>
      <div class="tablewrap"><table>
        <thead><tr><th>Card</th><th>Set</th><th>Golden</th></tr></thead>
        <tbody>${d.blocked.map((c) => `<tr>
          <td class="nm"><a href="#c/${encodeURIComponent(c.name)}">${esc(c.name)}</a></td>
          <td style="color:var(--muted)" class="mono">${esc(c.set)}</td>
          <td>${c.golden ? '<span class="tag w">hand-written</span>' : ""}</td>
        </tr>`).join("")}</tbody>
      </table></div>
      ${d.blocked.length < d.cards ? '<p class="note" style="margin-top:.5rem">Showing ' +
        fmt(d.blocked.length) + " of " + fmt(d.cards) + " — the list is capped.</p>" : ""}
    </div>`;
  wireProbe(by, d);
  rail("", []);
}

/* =========================== the feasibility probe =========================== */

/* Cards blocked says which cards a band REACHES. It does not say which lines it FINISHES, and every
   ranking this module has used that skipped the difference overstated its band — four times in the
   same direction. This box is the measurement that closes it: put a known-good prefix where the
   family's own span is, re-parse on the live grammar, count what got through. */
function probeHTML(d) {
  return `
    <div class="block">
      <h2>Would writing it finish these cards?</h2>
      <p class="note" style="margin-bottom:.7rem">Substitute a construct the grammar already reads for
      this family's own span, and re-parse every declined line of every card behind it. What comes back
      is how much of the payload the rest of the grammar can already handle — the number a band actually
      delivers, against the card counts above, which are the number it merely reaches.</p>
      <div class="form">
        <div class="pair">
          <label>Replace this span<input id="pb-find" value="${esc(d.probeFind || "")}"
            autocomplete="off" spellcheck="false"></label>
          <label>With this<input id="pb-repl" placeholder="When ~ enters,"
            autocomplete="off" spellcheck="false"></label>
        </div>
        <div class="toolrow" style="margin-top:.2rem">
          <label style="flex-direction:row;align-items:center;gap:.4rem;text-transform:none;letter-spacing:normal;font-size:.72rem;color:var(--muted)">
            <input type="checkbox" id="pb-rx" style="width:auto"> regex — for a span that varies in the
            middle, e.g. <code>Whenever you cast [^,]*,</code>
          </label>
          <button id="pb-run" class="linky" style="color:var(--accent)">Measure</button>
        </div>
      </div>
      <div id="pb-out"></div>
    </div>`;
}

function wireProbe(by, d) {
  const run = async () => {
    const find = el("pb-find").value, replace = el("pb-repl").value;
    el("pb-out").innerHTML = '<p class="note" style="margin-top:.8rem">re-parsing…</p>';
    const r = await post("probe", { by, key: d.key, find, replace, regex: el("pb-rx").checked ? "true" : "false" });
    el("pb-out").innerHTML = r.error ? '<div class="empty">' + esc(r.error) + "</div>" : probeResultHTML(r);
  };
  el("pb-run").onclick = run;
  for (const id of ["pb-find", "pb-repl"]) {
    el(id).onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); run(); } };
  }
}

function probeResultHTML(r) {
  return `
    <div class="stats" style="margin-top:1rem">
      <div class="stat"><span class="v ok">${fmt(r.cardsFinished)}</span><span class="k">Cards finished</span>
        <span class="s">every declined line reads</span></div>
      <div class="stat"><span class="v">${fmt(r.familyLinesParsing)} / ${fmt(r.familyLines)}</span>
        <span class="k">Lines that now parse</span>
        <span class="s">${share(r.familyLinesParsing, r.familyLines)} of the family</span></div>
      <div class="stat"><span class="v" style="color:${r.unmatched ? "var(--bad)" : "var(--faint)"}">${fmt(r.unmatched)}</span>
        <span class="k">Span not found</span><span class="s">lines the pattern missed</span></div>
      <div class="stat"><span class="v">${fmt(r.cardsConsidered)}</span><span class="k">Cards re-assayed</span>
        <span class="s">${fmt(r.millis)} ms on the live grammar</span></div>
    </div>
    <p class="note" style="margin-top:.7rem"><b>This is a prediction.</b> It assumes the construct you
    would write reads everything this family's span does — it measures whether the <em>rest</em> of each
    line is readable, and cannot tell you the span itself is expressible in <code>mtg-sdk</code> at all.
    A large "span not found" means the pattern is describing a different family than this one.</p>
    ${r.examples.length ? `<div class="tablewrap" style="margin-top:.8rem"><table>
      <thead><tr><th>Card</th><th>Declined line</th><th>After substitution</th><th></th></tr></thead>
      <tbody>${r.examples.map((e) => `<tr>
        <td class="nm"><a href="#c/${encodeURIComponent(e.card)}">${esc(e.card)}</a></td>
        <td class="mono" style="font-size:.72rem;color:var(--muted)">${esc(e.before)}</td>
        <td class="mono" style="font-size:.72rem">${esc(e.after)}</td>
        <td><span class="tag${e.parses ? " w" : ""}">${e.parses ? "reads" : "still declines"}</span></td>
      </tr>`).join("")}</tbody></table></div>` : ""}`;
}

/* =========================== cards =========================== */

const cardFilter = { state: "", q: "", set: "", scope: false, golden: false, ai: false, offset: 0, rows: [] };
let cardsShowAi = false;

async function viewCards() {
  const d = await api("cards", {
    state: cardFilter.state, q: cardFilter.q, set: cardFilter.set,
    scope: cardFilter.scope ? 1 : "", golden: cardFilter.golden ? 1 : "",
    ai: cardFilter.ai ? "gaps" : "",
    offset: cardFilter.offset, limit: 100,
  });
  if (indexing(d)) { el("view").innerHTML = indexingHTML(d); return; }
  cardFilter.rows = cardFilter.offset ? cardFilter.rows.concat(d.rows) : d.rows;
  cardsShowAi = !!d.aiAvailable;

  const states = [["", "all"], ["round-trip", "round-trip"], ["variant", "variant"],
                  ["vanilla", "vanilla"], ["declined", "declined"]];

  /* The set filter is membership — every card *printed* in the set — so it needs its own
     denominator. `total` is what the corpus reached; `setPrinted` is what the set holds. */
  const setNote = !cardFilter.set.trim() ? ""
    : d.setUnresolved
      ? '<p class="lead" style="margin-top:.6rem;color:var(--bad)">No set <b class="mono">' +
        esc(cardFilter.set) + "</b> — Scryfall knows no such code, or it is unreachable and nothing " +
        "is cached. Nothing is being shown rather than everything.</p>"
      : '<p class="lead" style="margin-top:.6rem">' + fmt(d.total) + " of the " + fmt(d.setPrinted) +
        " cards printed in <b class=\"mono\">" + esc(cardFilter.set.toUpperCase()) + "</b>. Membership " +
        "comes from Scryfall's per-set list, not from the Set column — that column is the one " +
        "printing the Oracle bulk shows a card under, which for a reprint is rarely this set.</p>";

  el("view").innerHTML = `
    <div class="crumb"><a href="#">overview</a> <span>/</span> <span>cards</span></div>
    <h1>The corpus, as assayed</h1>
    <p class="lead" style="margin-top:.5rem">Every card in Scryfall's Oracle bulk with the verdict the
    sweep gave it. <b>Round-trip</b> means every line printed back byte-for-byte; <b>variant</b> means
    a spelling was normalized and nothing was lost; <b>declined</b> means at least one line is not yet
    covered.</p>
    <div class="toolrow" style="margin-top:1rem">
      <div class="seg">${states.map(([v, l]) =>
        '<button data-state="' + v + '"' + (cardFilter.state === v ? ' class="on"' : "") + ">" + l + "</button>").join("")}</div>
      <input id="cq" class="grow" placeholder="name contains…" value="${esc(cardFilter.q)}" autocomplete="off" spellcheck="false">
      <input id="cset" style="width:5.5rem" placeholder="set" value="${esc(cardFilter.set)}" autocomplete="off" spellcheck="false"
             title="every card printed in the set — Scryfall's per-set list, not the Set column">
      <button class="chip${cardFilter.scope ? " on" : ""}" id="cscope" title="vanilla + keyword-only — Phase 1's own target class">in scope</button>
      <button class="chip${cardFilter.golden ? " on" : ""}" id="cgold" title="cards that already have a hand-written definition">hand-written</button>
      ${d.aiAvailable ? '<button class="chip' + (cardFilter.ai ? " on" : "") + '" id="cai" title="implemented cards the engine AI does not read fully">✕ AI gaps</button>' : ""}
      <span class="cnt">${fmt(d.total)} cards</span>
    </div>
    ${setNote}
    ${d.aiAvailable && !d.aiReady ? '<p class="note" style="margin:0 0 .6rem"><span class="dot load" style="display:inline-block;margin-right:.35rem"></span>' +
      "The AI reading index is still building in the background, so the AI column and the AI-gaps filter are incomplete. " +
      '<a href="#cards" id="airetry">Reload</a> in a few seconds.</p>' : ""}
    <div class="tablewrap"><table>
      <thead><tr><th>Card</th><th title="the printing the Oracle bulk shows this card under — one per Oracle ID, so a reprint is credited to its newest set">Set</th><th class="num">Lines</th><th>Verdict</th>${
        cardsShowAi ? '<th class="ai" title="implemented cards only: ✓ the engine AI reads every ability, ✕ it has gaps">AI</th>' : ""}<th>Blocked on</th></tr></thead>
      <tbody>${cardFilter.rows.map(cardRowHTML).join("")}</tbody>
    </table></div>
    ${cardFilter.rows.length < d.total
      ? '<div style="margin-top:.7rem"><button class="chip" id="more">load ' +
        fmt(Math.min(100, d.total - cardFilter.rows.length)) + " more of " + fmt(d.total) + "</button></div>"
      : ""}`;

  const reload = () => { cardFilter.offset = 0; cardFilter.rows = []; return viewCards(); };
  for (const b of el("view").querySelectorAll("[data-state]")) {
    b.onclick = () => { cardFilter.state = b.dataset.state; reload(); };
  }
  el("cscope").onclick = () => { cardFilter.scope = !cardFilter.scope; reload(); };
  el("cgold").onclick = () => { cardFilter.golden = !cardFilter.golden; reload(); };
  if (el("cai")) el("cai").onclick = () => { cardFilter.ai = !cardFilter.ai; reload(); };
  if (el("airetry")) el("airetry").onclick = (e) => { e.preventDefault(); reload(); };

  // Re-rendering replaces the input the user is typing in, so the caret is restored explicitly.
  let timer = null;
  const debounce = (field, id) => {
    const node = el(id);
    node.oninput = () => {
      cardFilter[field] = node.value;
      clearTimeout(timer);
      const at = node.selectionStart;
      timer = setTimeout(() => reload().then(() => {
        const next = el(id);
        if (next) { next.focus(); next.setSelectionRange(at, at); }
      }), 250);
    };
  };
  debounce("q", "cq");
  debounce("set", "cset");
  if (el("more")) el("more").onclick = () => { cardFilter.offset = cardFilter.rows.length; viewCards(); };
  rail("", []);
}

/* Three of these four are covered states and one is not; the colours say so. */
const STATE_TAG = {
  "round-trip": '<span class="tag k">round-trip</span>',
  "vanilla": '<span class="tag v" title="no rules text — read completely and correctly">vanilla</span>',
  "variant": '<span class="tag w">variant</span>',
  "declined": '<span class="tag">declined</span>',
};
const STATE_NOTE = {
  "round-trip": "every line printed back byte-for-byte",
  "vanilla": "no rules text at all — covered, trivially and completely",
  "variant": "a spelling was normalized; the model survived unchanged",
  "declined": "at least one line is not yet covered",
};

function cardRowHTML(r) {
  return `<tr>
    <td class="nm"><a href="#c/${encodeURIComponent(r.name)}">${esc(r.name)}</a>${
      r.golden ? ' <span class="tag w" title="has a hand-written definition">HW</span>' : ""}</td>
    <td class="mono" style="color:var(--muted)">${esc(r.set)}</td>
    <td class="num" style="color:var(--muted)">${r.lines}</td>
    <td>${STATE_TAG[r.state] || ""}</td>
    ${cardsShowAi ? '<td class="ai">' + (r.aiReadsFully === true ? '<span class="ic ok" title="the AI reads every ability" aria-label="AI reads it fully">✓</span>'
      : r.aiReadsFully === false ? '<span class="ic gap" title="the AI has gaps on this card" aria-label="AI has gaps">✕</span>' : "") + "</td>" : ""}
    <td class="mono" style="font-size:.72rem;color:var(--muted)">${
      r.declines.slice(0, 3).map((t) => '<a href="#d/token/' + encodeURIComponent(t) + '">' + esc(t) + "</a>").join(", ")}</td>
  </tr>`;
}

/* =========================== one card =========================== */

async function viewCard(name, toAi = false) {
  const d = await api("card", { name });
  if (indexing(d)) { el("view").innerHTML = indexingHTML(d); return; }
  if (d.error) {
    el("view").innerHTML = '<div class="crumb"><a href="#">overview</a></div><div class="empty">' +
      esc(d.error) + "</div>";
    return;
  }
  el("view").innerHTML = `
    <div class="crumb"><a href="#">overview</a> <span>/</span> <a href="#cards">cards</a> <span>/</span> <span>${esc(d.set)}</span></div>
    <div class="headline">
      <h1>${esc(d.name)}</h1>
      ${d.roundTrips ? '<span class="tag k">round-trips</span>' : d.covered ? '<span class="tag w">covered</span>' : '<span class="tag">not covered</span>'}
      ${d.inScope ? '<span class="tag" title="vanilla or keyword-only — Phase 1\'s target class">in scope</span>' : ""}
      <span class="tag">${esc(d.layout)}</span>
      <span class="tag ai-sum wait" id="aisum" title="what the engine AI's card readers understand of this card"><span class="dot load"></span>AI reading…</span>
      <span class="tag ai-sum wait" id="ratesum" hidden></span>
    </div>
    ${assayHTML(d)}
    <div class="block" id="rateblock" hidden></div>
    <div class="block" id="aiblock"><h2>AI reading</h2>
      <div class="aiwait"><span class="dot load"></span>Asking the engine AI's card readers…</div></div>
    ${goldenHTML(d.golden)}`;
  rail("", []);
  loadAiReading(d.name, toAi);
}

/* =========================== AI reading =========================== */

/* What the engine AI understands of the card, beside how Assay reads it. Its own request, so the
   Assay half paints at once; a response for a card the user has already left is dropped. */
let aiToken = 0;

async function loadAiReading(name, scroll = false) {
  const token = ++aiToken;
  let d;
  try { d = await api("ai", { name }); }
  catch (e) { d = { error: "the request failed (" + e.message + ")" }; }
  if (token !== aiToken || !el("aiblock")) return;
  const [sum, body] = aiReadingHTML(d);
  el("aisum").outerHTML = sum;
  el("aiblock").innerHTML = "<h2>AI reading</h2>" + body;
  if (d.rating) {
    const [rsum, rbody] = aiRatingHTML(d.rating, d.source === "preview", d.reading ? d.reading.abilities.length : null);
    el("ratesum").outerHTML = rsum;
    el("rateblock").innerHTML = rbody;
    el("rateblock").hidden = false;
    el("ratesum").onclick = () => el("rateblock").scrollIntoView({ behavior: "smooth", block: "start" });
    if (el("rate2read")) el("rate2read").onclick = () => el("aiblock").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  // The panel sits below Assay's (often long) reading; the chip up top jumps to it.
  el("aisum").onclick = () => el("aiblock").scrollIntoView({ behavior: "smooth", block: "start" });
  if (scroll) el("aiblock").scrollIntoView({ block: "start" });
}

const AI_SOURCE = {
  implemented: "Read from the engine's own definition of the card — the one the AI plays with.",
};

/* The summary chip and the panel body, for every state the route can answer with. */
function aiReadingHTML(d) {
  const chip = (cls, text, title) =>
    '<button class="tag ai-sum ' + cls + '" id="aisum" title="' + esc(title) + ' — jump to the AI reading">' + text + "</button>";
  if (d.available === false) {
    return [chip("wait", "AI reading n/a", "AI reading needs the game server"),
      `<div class="empty">The AI reading is only available when the explorer runs inside the game
      server — open it from the <b>Assay Explorer</b> tab of the Set Completion view. Standalone
      <code>just assay-explore</code> has no engine AI on its classpath, by design: Assay depends on
      the SDK alone.</div>`];
  }
  if (indexing(d)) {
    return [chip("wait", "AI reading…", "waiting for the corpus sweep"),
      '<div class="aiwait"><span class="dot load"></span>Waiting for the corpus sweep to finish.</div>'];
  }
  if (d.error) {
    return [chip("gap", "AI reading failed", d.error),
      '<div class="empty" style="border-color:var(--bad);color:var(--bad)">Couldn\'t read this card: ' + esc(d.error) + "</div>"];
  }
  if (d.source === "none") {
    return [chip("wait", "AI: nothing to read", "not implemented, and Assay doesn't read it whole"),
      `<div class="empty">Nobody has implemented this card and Assay doesn't read it whole, so there is
      no definition for the AI to read. Assay stopped at: ${esc(d.why)}</div>`];
  }
  const r = d.reading;
  const checked = r.abilities.filter((a) => a.checked);
  const read = checked.filter((a) => a.readFully).length;
  const preview = d.source === "preview";
  const summary = checked.length
    ? (preview ? "AI would read " : "AI reads ") + read + "/" + checked.length + " abilit" + (checked.length === 1 ? "y" : "ies")
    : "AI: nothing to read";
  const sum = chip(checked.length ? (read === checked.length ? "ok" : "gap") : "wait",
    (checked.length ? (read === checked.length ? "✓ " : "✕ ") : "") + summary,
    preview ? "a preview: the card isn't implemented" : "of the abilities the AI's readers are asked about");

  let html = preview
    ? `<div class="callout preview"><span class="h">Preview — not implemented</span><p>Nobody has
      implemented this card yet. This is what the AI would understand if it were implemented the way
      Assay reads it: the readers ran on Assay's whole-card compile.</p></div>`
    : '<p class="note">' + AI_SOURCE.implemented + "</p>";
  if (r.abilities.length) html += `<div class="aikey"><span><span class="ic ok">✓</span>understood</span>
    <span><span class="ic gap">✕</span>not understood — the AI falls back to a generic default here</span>
    ${r.abilities.some((a) => !a.checked) ? '<span><span class="ic na">–</span>not checked</span>' : ""}</div>`;
  else {
    html += `<div class="empty">No spell effect and no abilities for the readers to check. Keywords
      such as flying aren't part of this reading.</div>`;
  }
  html += r.abilities.map(aiAbilityHTML).join("");
  if (r.flags.length) {
    html += '<details class="raw"><summary>audit flags (' + r.flags.length + ")</summary>" +
      '<div class="struct" style="margin-top:.35rem">' + r.flags.map(esc).join("<br>") + "</div>" +
      '<p class="note" style="margin-top:.35rem">The same keys <code>just ai-reading-audit</code> groups by, ' +
      "and the ratchet baseline records.</p></details>";
  }
  return [sum, html];
}

function aiAbilityHTML(a) {
