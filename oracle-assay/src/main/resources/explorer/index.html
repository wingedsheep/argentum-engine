  const state = !a.checked ? "na" : a.readFully ? "ok" : "gap";
  const icon = state === "ok" ? "✓" : state === "gap" ? "✕" : "–";
  const title = (a.face ? a.face + " · " : "") + a.title;
  const fs = a.checked
    ? a.findings.map(aiFindingHTML).join("")
    : '<div class="aif"><span></span><span class="note">Static abilities aren\'t checked: the AI sees ' +
      "their effect through the board state rather than through a card reader.</span></div>";
  return `<div class="aiab ${state}">
    <div class="head"><span class="ic ${state}" aria-label="${state === "ok" ? "understood" : state === "gap" ? "not fully understood" : "not checked"}">${icon}</span>
      <span class="txt"><span class="ttl">${esc(title)}</span> ${esc(a.text) || '<span class="note">(no text)</span>'}</span>
      ${state === "ok" ? '<span class="tag k">read</span>' : state === "gap" ? '<span class="tag w">gaps</span>' : '<span class="tag">not checked</span>'}</div>
    <div class="fs">${fs}</div>
  </div>`;
}

function aiFindingHTML(f) {
  const where = [f.reader];
  if (f.mode) where.push("mode " + f.mode);
  if (f.step) where.push("step " + f.step + (f.stepText ? ' <q>' + esc(f.stepText) + "</q>" : ""));
  if (f.effectType) where.push(esc(f.effectType));
  const cls = f.read ? "ok" : "gap";
  return `<div class="aif ${cls}"><span class="ic ${cls}" aria-label="${f.read ? "understood" : "not understood"}">${f.read ? "✓" : "✕"}</span>
    <span><span class="why">${esc(f.reason)}</span><span class="dev">${where.join(" · ")}</span></span></div>`;
}

/* =========================== AI rating =========================== */

/* The limited pick scale's bands, as docs/limited-card-ratings.md draws them: the scorer's absolute
   cutoffs (bomb at 3.9), not a per-set curve. */
const PICK_BANDS = [
  { to: 1.0, word: "Unplayable" },
  { to: 2.2, word: "Marginal" },
  { to: 3.0, word: "Solid" },
  { to: 3.9, word: "Premium" },
  { to: 5.0, word: "Bomb" },
];
const pickBand = (r) => { const i = PICK_BANDS.findIndex((b) => r < b.to); return i < 0 ? PICK_BANDS.length - 1 : i; };
const f1 = (x) => (Math.round(x * 10) / 10).toFixed(1);
const f2 = (x) => (Math.round(x * 100) / 100).toFixed(2);
const signed = (x, f = f1) => (x > 0 ? "+" : x < 0 ? "−" : "±") + f(Math.abs(x));

/* A 0–[max] track with coloured zones and markers; [marks] are {at, label, cls}. */
function gaugeHTML(max, zones, marks, active) {
  const pct = (x) => Math.max(0, Math.min(100, (x * 100) / max));
  let from = 0;
  const track = zones.map((z, i) => {
    const w = pct(z.to) - pct(from); from = z.to;
    const mix = 10 + i * 18;
    return `<span class="zone" style="width:${w}%;background:color-mix(in srgb, var(--accent) ${mix}%, var(--sunken))"></span>`;
  }).join("");
  from = 0;
  const words = zones.map((z, i) => {
    const w = pct(z.to) - pct(from); from = z.to;
    return `<span style="width:${w}%" class="${i === active ? "on" : ""}">${esc(z.word)}</span>`;
  }).join("");
  const mk = marks.map((m) => {
    const at = pct(m.at);
    const edge = at < 8 ? " edge-l" : at > 92 ? " edge-r" : "";
    return `<span class="mk ${m.cls || ""}${edge}" style="left:${at}%"><span>${esc(m.label)}</span></span>`;
  }).join("");
  const plain = !zones.some((z) => z.word);
  return `<div class="gauge${plain ? " plain" : ""}" role="img" aria-label="${esc(marks.map((m) => m.label).join(", "))}">
    <div class="track">${track}</div>${zones.some((z) => z.word) ? '<div class="zones">' + words + "</div>" : ""}${mk}</div>`;
}

/* A waterfall: each part a bar from where the running total stood to where it ends. The axis is
   [max] wide (or the total, if larger); [cap] marks a clamp the parts may overshoot. */
function waterfallHTML(title, parts, total, max, opts = {}) {
  let run = 0, lo = 0, hi = 0;
  for (const p of parts) { run += p.value; lo = Math.min(lo, run); hi = Math.max(hi, run); }
  const span = Math.max(max, hi) - lo;
  const pos = (x) => ((x - lo) * 100) / span;
  run = 0;
  const cap = opts.cap != null && hi > opts.cap ? `<span class="cap" style="left:${pos(opts.cap)}%" title="clamped to ${opts.cap}"></span>` : "";
  const rows = parts.map((p) => {
    const a = run, b = run + p.value; run = b;
    const l = pos(Math.min(a, b)), w = Math.max(.8, Math.abs(pos(b) - pos(a)));
    const tip = p.label + (p.detail ? " — " + p.detail : "") + ": " + signed(p.value, opts.fmt);
    return `<div class="wrow" title="${esc(tip)}"><span class="wl">${esc(p.label)}${p.detail ? ' <span class="d">' + esc(p.detail) + "</span>" : ""}</span>
      <span class="wt"><i class="${p.value < 0 ? "neg" : ""}" style="left:${l}%;width:${w}%"></i>${cap}</span>
      <span class="wv">${signed(p.value, opts.fmt)}</span></div>`;
  }).join("");
  const tl = pos(Math.min(0, total)), tw = Math.max(.8, Math.abs(pos(total) - pos(0)));
  return `<div class="wf"><div class="wh"><span>${esc(title)}</span>${opts.aside ? "<span>" + opts.aside + "</span>" : ""}</div>${rows}
    <div class="wrow tot"><span class="wl">${esc(opts.totalLabel || "Total")}</span>
      <span class="wt"><i style="left:${tl}%;width:${tw}%"></i>${cap}</span>
      <span class="wv">${(opts.fmt || f1)(total)}</span></div></div>`;
}

const PICK_SOURCE = {
  basicLand: () => "Basic lands rate <b>0</b> — every deck gets them for free.",
  land: () => "Non-basic lands are flat <b>1.5</b> filler for decks built outside a draft.",
  winRate: (p) => `From <b>17Lands</b>: a ${(p.winRate * 100).toFixed(1)}% game-in-hand win rate over ${Number(p.games).toLocaleString()} games.`,
  table: (p) => `From the <b>${esc(p.tableSet || "")}</b> pick table — Draftsim's ratings, or a first-party table on the same scale.`,
  heuristic: () => "Estimated by the <b>effect heuristic</b> from what the card does.",
};

function aiRatingHTML(r, preview, abilities) {
  const p = r.pick, b = pickBand(p.rating);
  const guess = p.source === "heuristic";
  const chip = '<button class="tag ai-sum ' + (guess ? "gap" : b >= 3 ? "ok" : "wait") + '" id="ratesum" title="' +
    (guess ? "no draft rating — the AI estimates it with the effect heuristic" : "how the engine AI rates this card") + ' — jump to it">Pick ' +
    f1(p.rating) + " · " + (guess ? "heuristic" : PICK_BANDS[b].word) + "</button>";

  const marks = [{ at: p.rating, label: f1(p.rating) }];
  if (p.source !== "heuristic" && p.heuristic.length && Math.abs(p.heuristicRating - p.rating) >= 0.15) {
    marks.push({ at: Math.min(5, p.heuristicRating), label: "heuristic " + f1(p.heuristicRating), cls: "ghost" });
  }
  const zones = PICK_BANDS.map((z) => ({ to: z.to, word: z.word }));
  let draft = `<div class="rcard"><h3>Draft &amp; deckbuilding</h3>
    <div class="rhead"><span class="rnum">${f1(p.rating)}<small>/ 5</small></span><span class="rband" data-b="${b}">${PICK_BANDS[b].word}</span></div>
    ${gaugeHTML(5, zones, marks, b)}
    <p class="rsrc">${PICK_SOURCE[p.source] ? PICK_SOURCE[p.source](p) : esc(p.source)}</p>`;
  if (p.source === "heuristic") {
    draft += `<div class="callout preview" style="margin:.6rem 0 0"><span class="h">No draft rating</span><p>No 17Lands data and no
      pick table rates this card, in any set. The AI falls back to the effect heuristic below — a structural guess that can't
      see synergy or how the format plays, so treat this number with care.</p></div>`;
  }

  if (p.sets.length) {
    // A set whose own table rates the card gets a row; every set that falls back to the limited
    // rater gets the same number, so they share one row instead of repeating it a dozen times.
    const own = p.sets.filter((s) => s.fromTable || s.rating == null);
    const filled = p.sets.filter((s) => !s.fromTable && s.rating != null);
    const rows = own.map((s) => ({ ...s, label: s.set, title: s.set }));
    if (filled.length) {
      const one = filled.length === 1;
      rows.push({ ...filled[0], removal: filled.some((s) => s.removal), archetypes: [],
        label: one ? filled[0].set : filled.length + " sets", title: filled.map((s) => s.set).join(", ") });
    }
    const fb = filled.length > 0;
    draft += '<div class="wf"><div class="wh"><span>Where the draft AI starts, by set</span></div></div><div class="psets">' + rows.map((s) => {
      const fallback = p.source === "heuristic" ? '<span class="tag w" title="no table rates it: the effect heuristic">heuristic</span>'
        : p.source === "winRate" ? '<span class="tag" title="no rating in this set: 17Lands win rate">17Lands</span>'
        : '<span class="tag" title="no rating in this set: borrowed from another set\'s table">from ' + esc(p.tableSet || "table") + "</span>";
      const tags = [s.rating == null ? '<span class="tag">land handling</span>' : !s.fromTable ? fallback : ""];
      if (s.removal) tags.push('<span class="tag k">removal</span>');
      (s.archetypes || []).slice(0, 3).forEach((a) => tags.push('<span class="tag">' + esc(a) + "</span>"));
      const tip = s.rating == null ? "the set's table doesn't rate this land; the drafter's land handling picks it"
        : s.fromTable ? "rated by the set's own pick table"
        : p.source === "heuristic" ? "no draft rating — the effect heuristic fills it in"
        : "no rating in this set's table — the limited rater fills it in";
      return `<div class="pset" title="${esc(s.title + ": " + tip)}"><span class="sc">${esc(s.label)}</span>
        <span class="bar">${s.rating != null ? '<i class="' + (s.fromTable ? "" : "fb") + '" style="width:' + (s.rating * 20) + '%"></i>' : ""}</span>
        <span class="v">${s.rating != null ? f1(s.rating) : "—"}</span><span class="tags">${tags.join("")}</span></div>`;
    }).join("") + "</div>";
    if (fb) draft += '<div class="rlegend"><span><i></i>rated in the set\'s own table</span><span><i class="fb"></i>no rating there — ' +
      (p.source === "heuristic" ? "heuristic guess" : p.source === "winRate" ? "17Lands win rate" : "borrowed from " + esc(p.tableSet || "another table")) + "</span></div>";
    draft += '<p class="note" style="margin-top:.45rem">The pick scorer then weighs colour commitment, archetype fit and removal against the picks so far.</p>';
  }
  if (p.heuristic.length) {
    const heurTitle = p.source === "heuristic" ? "What the heuristic adds up" : "What the heuristic would say";
    draft += waterfallHTML(heurTitle, p.heuristic, Math.min(5, Math.max(0, p.heuristicRating)), 5, { cap: 5, totalLabel: "Heuristic" });
  }
  draft += "</div>";

  const bd = r.board;
  let play = '<div class="rcard"><h3>In play</h3>';
  if (bd.value != null) {
    // Familiar reference points on the evaluator's own scale, so a bare number means something.
    const refs = [{ at: 0.6, label: "land" }, { at: 2.8, label: "2/2" }, { at: 4.9, label: "2/2 flier" }, { at: 8.3, label: "4/4 flier" }];
    const max = Math.max(10, Math.ceil(bd.value + 1));
    play += `<div class="rhead"><span class="rnum">${f1(bd.value)}<small>board points</small></span></div>
      ${gaugeHTML(max, [{ to: max, word: "" }], [...refs.map((x) => ({ ...x, cls: "ref" })), { at: bd.value, label: f1(bd.value) }], -1)}
      <p class="rsrc">What the evaluator counts this card for on an empty battlefield${bd.kind === "creature" ? ", before damage, tapping or summoning sickness" : ""}.
      Ticks for scale: an untapped land and three vanilla creatures. A removal permanent like Oblivion Ring is 3.5.</p>`;
    if (bd.parts.length > 1) play += waterfallHTML("Where it comes from", bd.parts, bd.value, max, { fmt: f1, totalLabel: "Board value" });
    else if (bd.parts.length) play += `<div class="wf"><div class="wh"><span>Priced as</span></div><div class="wrow"><span class="wl">${esc(bd.parts[0].label)}</span><span class="wt"><i style="left:0;width:${(bd.parts[0].value * 100) / max}%"></i></span><span class="wv">${f1(bd.parts[0].value)}</span></div></div>`;
    if (bd.rule) play += '<p class="note" style="margin-top:.45rem">' + esc(bd.rule) + "</p>";
  } else {
    play += '<div class="rempty">' + esc(bd.rule || "No board value") + "</div>";
  }
  const it = r.intent;
  // A creature's main job is its body, which the evaluator prices from stats (above) — that is a
  // reading, not a gap. Intent tags are about its abilities, so "not recognised" is only said when
  // there are abilities the analyzer couldn't place. Sorcery speed is every card's default and goes
  // unsaid; instant speed and a static or activated payoff are worth a chip.
  const creature = bd.kind === "creature" || bd.kind === "variableCreature";
  const chips = [];
  if (creature) chips.push('<span class="itag sp" title="attacks and blocks — valued from its stats and keywords, under In play">Creature body</span>');
  it.tags.forEach((t) => chips.push('<span class="itag" title="' + esc(t.key) + '">' + esc(t.label) + "</span>"));
  if (!it.tags.length && abilities !== 0) {
    chips.push('<button class="itag none" id="rate2read" title="the intent analyzer recognised none of its abilities — see the AI reading below">' +
      (creature ? "Abilities not recognised" : "Not recognised") + "</button>");
  } else if (!it.tags.length && !creature) {
    chips.push('<span class="itag sp" title="no spell effect or abilities for the analyzer to read">Nothing to read</span>');
  }
  if (it.speed !== "Sorcery speed") chips.push('<span class="itag sp">' + esc(it.speed) + "</span>");
  if (r.advisor) chips.push('<span class="itag sp" title="a hand-written card advisor the live AI consults">Advisor: ' + esc(r.advisor) + "</span>");
  play += '<div class="wf"><div class="wh"><span>What the AI thinks it is for</span></div></div><div class="itags" style="margin-top:.2rem">' +
    chips.join("") + "</div>";
  if (it.facts.length) play += '<ul class="ifacts">' + it.facts.map((x) => "<li>" + esc(x) + "</li>").join("") + "</ul>";
  play += "</div>";

  const lead = preview
    ? '<div class="callout preview"><span class="h">Preview — not implemented</span><p>Rated from Assay\'s compile of the card: the numbers the AI would use if it were written that way.</p></div>'
    : '<p class="note">The numbers the engine AI uses, from the same code it calls when it drafts, builds a deck and evaluates a board.</p>';
  return [chip, "<h2>How the AI rates it</h2>" + lead + '<div class="rgrid">' + draft + play + "</div>"];
}

/* The two panes: what Wizards printed, and what Assay makes of it. */
function assayHTML(d) {
  return '<div class="sxs">' +
    "<div><h3>Printed</h3>" + d.faces.map(faceHTML).join('<div class="note">//</div>') + "</div>" +
    "<div><h3>Assay's reading</h3>" + d.faces.map(readingHTML).join("") + "</div>" +
    "</div>";
}

function faceHTML(f) {
  return `<div class="face">
    <div class="fname"><span>${esc(f.name)}</span><span>${manaHTML(f.manaCost)}</span></div>
    <div class="ftype">${esc(f.typeLine)}</div>
    <div class="ftext">${rulesHTML(f.oracleText) || '<p style="color:var(--faint)">(no rules text)</p>'}</div>
  </div>`;
}

const MANA_CLASS = { W: "w", U: "u", B: "b", R: "r", G: "g", C: "c" };
const manaHTML = (cost) => (String(cost || "").match(/\{[^}]*\}/g) || [])
  .map((s) => '<span class="pip">' + esc(s.slice(1, -1)) + "</span>").join("");
const rulesHTML = (text) => String(text || "").split("\n")
  .map((l) => l.trim() ? "<p>" + esc(l).replace(/\{[^}]*\}/g, (s) => manaHTML(s)) + "</p>" : "").join("");

function readingHTML(face) {
  let html = "";
  if (!face.normalizationHolds) {
    html += '<div class="empty" style="border-color:var(--bad);color:var(--bad)">' +
      "Normalization is not invertible for this face — a bug in Assay, and it is gated.</div>";
  }
  if (face.vanilla) {
    html += '<div class="empty">Vanilla — no rules text. Covered trivially, and a fifth of the corpus.</div>';
  }
  html += face.lines.map(lineHTML).join("");
  if (face.glosses && face.glosses.length) {
    html += '<div class="block"><h3>Reminder-text audit</h3>' + face.glosses.map((g) => `
      <div class="line ${g.verdict === "MATCHED" ? "rt" : g.verdict === "DIFFERED" ? "va" : "de"}">
        <div class="head"><span class="lt">${esc(g.keyword)}</span><span class="tag">${g.verdict}</span></div>
        ${g.verdict === "DIFFERED" ? '<div class="body">' +
          kv("printed", '<div class="struct">' + esc(g.printed) + "</div>") +
          kv("ours", '<div class="struct">' + esc(g.regenerated) + "</div>") + "</div>" : ""}
      </div>`).join("") +
      '<p class="note">Regenerating a printed gloss from our own keyword model. Reported, never gated ' +
      "— a difference means the model and the printed gloss disagree about what the keyword does.</p></div>";
  }
  return html;
}

const VERDICT_CLASS = { ROUND_TRIP: "rt", VARIANT: "va", DECLINED: "de", MISMATCH: "er", AMBIGUOUS: "er" };
const VERDICT_TAG = { ROUND_TRIP: "k", VARIANT: "w", DECLINED: "", MISMATCH: "b", AMBIGUOUS: "b" };

function lineHTML(line) {
  const body = [];
  if (line.keywords && line.keywords.length) {
    body.push(kv("model", line.keywords.map((k) =>
      '<div class="struct">' + esc(k.structure) + '<br><span class="d">' + esc(k.description) + "</span></div>").join("")));
  }
  if (line.script) body.push(kv("script", '<pre class="code">' + esc(prettyJSON(line.script)) + "</pre>"));
  if (line.printed && line.printed !== line.text) {
    body.push(kv("prints as", '<div class="struct">' + esc(line.printed) + "</div>"));
  }
  if (line.decline) body.push(kv("died at", caretHTML(line.text, line.decline)));
  if (line.redundantReadings) {
    body.push(kv("redundant", '<span class="note">' + line.redundantReadings +
      " extra reading(s) produced the same model — grammar redundancy, reported not gated.</span>"));
  }
  return `<div class="line ${VERDICT_CLASS[line.verdict] || ""}">
    <div class="head">
      <span class="lt">${esc(line.text) || '<span style="color:var(--faint)">(empty line)</span>'}</span>
      <span class="tag ${VERDICT_TAG[line.verdict]}">${line.verdict}</span>
    </div>
    ${body.length ? '<div class="body">' + body.join("") + "</div>" : ""}
  </div>`;
}

const kv = (k, v) => '<div class="kv"><span class="k">' + esc(k) + "</span><div>" + v + "</div></div>";

/* The caret `assay explain` draws, in HTML: the line, the column it died on, what it wanted there. */
function caretHTML(text, d) {
  const at = Math.max(0, Math.min(d.position, text.length));
  const want = d.reason === "PARSE_CAP" ? "too many readings (parse cap) — needs left-factoring here"
             : d.reason === "LEFT_RECURSION" ? "the rule re-entered itself here (left recursion)"
             : "expected " + (d.expected.join(" | ") || "<nothing>");
  return '<pre class="caret">' + esc(text) + "\n" + " ".repeat(at) + "<b>^ " + esc(want) + "</b></pre>";
}

function prettyJSON(s) {
  try { return JSON.stringify(JSON.parse(s), null, 2); } catch (e) { return s; }
}

/* ---- the differential, for this one card ---- */

function goldenHTML(g) {
  if (!g) return "";
  if (!g.present) {
    return `<div class="block"><h2>Against the hand-written card</h2>
      <div class="empty">No hand-written definition for this card, so the differential has nothing to
      compare against. Its verdict here is the touchstone's alone — which proves the reading is
      <em>reversible</em>, never that it is <em>right</em>.</div></div>`;
  }
  const ok = g.verdict === "CONFIRMED";
  const diff = (g.onlyInText || []).length || (g.onlyInCard || []).length || g.textScript || g.cardScript;
  return `<div class="block">
    <h2>Against the hand-written card</h2>
    <div class="headline">
      ${g.verdict ? '<span class="tag ' + (ok ? "k" : "b") + '">' + g.verdict + "</span>"
                  : '<span class="tag">not compared</span>'}
      <span class="tag">${esc(g.population)}</span>
      <span class="tag">${esc(g.set)}</span>
    </div>
    <p>${esc(g.populationNote)}</p>
    ${diff ? `<div class="line er"><div class="body">
      ${(g.onlyInText || []).length ? kv("text has", '<div class="struct">' + g.onlyInText.map(esc).join("<br>") + "</div>") : ""}
      ${(g.onlyInCard || []).length ? kv("card has", '<div class="struct">' + g.onlyInCard.map(esc).join("<br>") + "</div>") : ""}
      ${g.textScript ? kv("from text", '<pre class="code">' + esc(prettyJSON(g.textScript)) + "</pre>") : ""}
      ${g.cardScript ? kv("on the card", '<pre class="code">' + esc(prettyJSON(g.cardScript)) + "</pre>") : ""}
    </div></div>
    <p class="note">A divergence is a finding to classify as <b>parser bug</b>, <b>card bug</b>, or
    <b>fold</b> — never silenced to make a number look better. The one worth the most is a bug in
    the hand-written card.</p>` : ""}
    <details class="raw"><summary>the golden definition</summary>
      <pre class="code" style="margin-top:.4rem">${esc(prettyJSON(g.json))}</pre></details>
  </div>`;
}

/* =========================== grammar =========================== */

let GRAMMAR = null;

async function viewGrammar(focus) {
  if (!GRAMMAR) GRAMMAR = await api("grammar");
  const rules = GRAMMAR.rules, byId = new Map(rules.map((r) => [r.id, r]));

  const groups = new Map();
  for (const r of rules) {
    if (!groups.has(r.group)) groups.set(r.group, []);
    groups.get(r.group).push(r);
  }
  const ordered = [...groups.entries()].sort((a, b) => b[1].length - a[1].length);
  const current = focus && groups.has(focus) ? focus : ordered[0][0];

  rail("Rule groups", ordered.map(([g, rs]) =>
    '<button class="rl' + (g === current ? " on" : "") + '" data-go="#g/' + encodeURIComponent(g) +
    '"><span>' + esc(g) + '</span><span class="n">' + rs.length + "</span></button>"));

  const used = rules.filter((r) => r.usageLines).length;
  const mine = groups.get(current).slice().sort((a, b) => (b.usageLines || 0) - (a.usageLines || 0));

  el("view").innerHTML = `
    <div class="crumb"><a href="#">overview</a> <span>/</span> <a href="#grammar">grammar</a></div>
    <h1>${esc(current)}</h1>
    <p class="lead" style="margin-top:.5rem">Every rule reachable from the entry point, walked from
    the root rather than assembled from a list — so what is here is the grammar that <em>runs</em>.
    A rule sitting in a file but wired into nothing cannot appear.</p>

    <div class="stats" style="margin-top:1rem">
      <div class="stat"><span class="v">${fmt(rules.length)}</span><span class="k">Rules, wired</span></div>
      <div class="stat"><span class="v">${fmt(ordered.length)}</span><span class="k">Groups</span></div>
      <div class="stat"><span class="v">${fmt(used)}</span><span class="k">Printed something</span>
        <span class="s">over the whole corpus</span></div>
      <div class="stat"><span class="v">${fmt(rules.filter((r) => !r.canonical).length)}</span>
        <span class="k">Alternate spellings</span><span class="s">parse, never print</span></div>
    </div>

    <div class="block">
      <h2>${esc(current)} — ${mine.length} rules</h2>
      <div class="tablewrap"><table>
        <thead><tr><th>Rule</th><th>Kind</th><th class="num">Lines</th><th class="num">Cards</th><th></th></tr></thead>
        <tbody>${mine.map((r) => ruleRowHTML(r, byId, mine)).join("")}</tbody>
      </table></div>
      <p class="note" style="margin-top:.5rem"><b>Lines</b> and <b>cards</b> count what this rule was
      the one to <em>print</em>. The kernel records no parse provenance, but printing is deterministic
      — an alternation prints through the first canonical branch that can express the value —
      so this is an exact answer rather than an estimate, and it is the same walk the round trip
      depends on. Blank means the rule never printed anything in the whole corpus.</p>
    </div>

    <div class="callout">
      <span class="h">Bidirectional or it doesn't ship</span>
      <p>A canonical rule registers <code>build</code> (text&rarr;model) <em>and</em> <code>match</code>
      (model&rarr;text), and the kernel refuses to construct one without both. That is what buys the
      gate: <code>print(parse(normalize(t))) == normalize(t)</code>. An
      <span class="tag">alternate</span> is the one exception — a second English spelling that
      parses and never prints, so that one meaning keeps one printed form.</p>
    </div>`;
}

const KIND_NOTE = {
  template: "a surface template with slots",
  choice: "an alternation — every branch is tried, so ambiguity is detected rather than hidden by ordering",
  run: "a separator-joined run",
  alternate: "parses, never prints",
  leaf: "a regex leaf, verified against itself on every print",
};

function ruleRowHTML(r, byId, siblings) {
  const detail =
    r.kind === "template" ? '<code style="font-size:.72rem">' + esc(r.template) + "</code>" +
      (r.slots && r.slots.length ? " " + r.slots.map((s) =>
        '<span class="tag">' + esc(s.name) + " = " + esc(s.ruleName) + "</span>").join(" ") : "")
    : r.kind === "leaf" ? '<code style="font-size:.7rem;color:var(--muted)">' + esc(r.pattern) + "</code>"
    : r.kind === "run" ? '<span class="note">joined by "' + esc(r.separator) + '", at least ' + r.min + "</span>"
    : r.kind === "choice" ? '<span class="note">' + (r.children || []).length + " alternatives</span>"
    : "";
  return `<tr>
    <td class="nm">${esc(r.name)}${r.canonical ? "" : ' <span class="tag w">alternate</span>'}</td>
    <td><span class="tag" title="${esc(KIND_NOTE[r.kind] || "")}">${esc(r.kind)}</span></td>
    <td class="num">${r.usageLines ? fmt(r.usageLines) : '<span style="color:var(--faint)">—</span>'}</td>
    <td class="num" style="color:var(--muted)">${r.usageCards ? fmt(r.usageCards) : ""}</td>
    <td>${detail}</td>
  </tr>`;
}

/* =========================== differential =========================== */

let DIFFERENTIAL = null;

async function viewDifferential() {
  rail("", []);
  const header = `
    <div class="crumb"><a href="#">overview</a> <span>/</span> <span>differential</span></div>
    <h1>Assay's reading vs. the hand-written card</h1>
    <p class="lead" style="margin-top:.5rem">The touchstone proves a parse is <em>reversible</em>. It
    structurally cannot prove the parse is <em>right</em> — "Elves" de-pluralizing to
    <code>Elve</code> round-trips forever and means nothing. This is the gate that asks the other
    question, against an asset the incumbent pipeline never had: the committed goldens for the cards a
    human already wrote from the same text.</p>`;

  if (!DIFFERENTIAL) {
    el("view").innerHTML = header + `
      <div class="block"><div class="empty">This one decodes every hand-written golden, so it runs on
      demand rather than at startup. Give it a few seconds.<br><br>
      <button class="primary" id="rundiff">Run the differential</button></div></div>`;
    el("rundiff").onclick = async () => {
      el("rundiff").textContent = "running…";
      el("rundiff").disabled = true;
      DIFFERENTIAL = await api("differential");
      viewDifferential();
    };
    return;
  }

  const d = DIFFERENTIAL;
  if (indexing(d)) { el("view").innerHTML = header + indexingHTML(d); DIFFERENTIAL = null; return; }
  if (d.error) { el("view").innerHTML = header + '<div class="empty">' + esc(d.error) + "</div>"; DIFFERENTIAL = null; return; }

  el("view").innerHTML = header + `
    <div class="stats" style="margin-top:1.2rem">
      <div class="stat"><span class="v">${fmt(d.cards)}</span><span class="k">Hand-written cards</span></div>
      <div class="stat"><span class="v">${pct(d.agreement)}</span><span class="k">Agreement</span>
        <span class="s">of those compared</span></div>
      <div class="stat"><span class="v ok">${fmt(d.confirmed)}</span><span class="k">Confirmed</span></div>
      <div class="stat"><span class="v ${d.divergent ? "bad" : ""}">${fmt(d.divergent)}</span>
        <span class="k">Divergent</span><span class="s">read every one</span></div>
    </div>

    <div class="block">
      <h2>Why each card was or was not compared</h2>
      <div class="tablewrap"><table>
        <thead><tr><th>Population</th><th class="num">Cards</th><th>Why</th></tr></thead>
        <tbody>${d.populations.map((p) => `<tr>
          <td class="nm">${esc(p.name)}</td>
          <td class="num">${fmt(p.count)}</td>
          <td style="color:var(--muted)">${esc(p.note)}</td>
        </tr>`).join("")}</tbody>
      </table></div>
      <p class="note" style="margin-top:.5rem">Scoping is <b>fail-closed</b>: a card is compared only
      where Assay reads every line of it, the text is the same text, the definition uses only modelled
      slots, and the lines fold into one card. Everything else lands in a named bucket so the
      denominator stays visible — widening a guard to raise the compared count is the gate lying
      to itself, and it has happened three times.</p>
    </div>

    ${d.undecodable.length ? bugList("Goldens that would not decode (must be 0)", d.undecodable) : ""}

    <div class="block">
      <h2>Divergences — ${fmt(d.divergent)}</h2>
      ${d.divergences.length ? d.divergences.map(divergenceHTML).join("")
        : '<div class="empty">None. That number is not meant to stay at zero — it rises every time ' +
          "the grammar reaches a new class of card, and each rise is the gate earning its keep.</div>"}
    </div>`;
}

function divergenceHTML(v) {

    </div>
    <div class="body">

      ${v.onlyInCard.length ? kv("card has", '<div class="struct">' + v.onlyInCard.map(esc).join("<br>") + "</div>") : ""}
      ${v.textScript ? kv("from text", '<pre class="code">' + esc(prettyJSON(v.textScript)) + "</pre>") : ""}

const SAMPLE = {

function viewParse() {

  el("view").innerHTML = `

    <p class="lead" style="margin-top:.5rem">Run any Oracle text through the grammar on this

    takes, normalization and the invertibility check included, because the interesting half often
    happens before the grammar starts.</p>
    <p>For a <b>custom card</b> this inverts the usual rule: a real card that declines is an SDK gap
    to fix, while a custom card that declines is usually a card to <em>reword</em>. Its text is
    authorable, and text outside canonical Magic templating is text that will confuse players.</p>

    <div class="sxs" style="margin-top:1.2rem">
      <div>
        <h3>Card</h3>
        <div class="form">
          <label>Name<input id="f-name" spellcheck="false"></label>

            <button class="chip" id="pfill">Load an example</button>
          </div>

          name the way Oracle text does.</p>
        </div>

async function runParse() {
  const body = {
    name: el("f-name").value.trim(),
    manaCost: el("f-cost").value.trim(),
    typeLine: el("f-type").value.trim(),
    oracleText: el("f-text").value,
  };
  el("pnote").textContent = "Parsing…";
  let d;
  try { d = await post("parse", body); }
  catch (e) { el("pnote").textContent = "The parser did not answer: " + e.message; return; }
  el("pnote").innerHTML = d.roundTrips
    ? "Every line round-tripped byte-for-byte."
    : d.covered ? "Covered — one or more spellings were normalized, and nothing was lost."
    : "At least one line declined. That is information, not a failure.";
  el("pout").innerHTML = d.faces.map(readingHTML).join("");
}

/* =========================== search =========================== */

let rows = [], cursor = -1, searchTimer = null;

async function search(text) {
  const box = el("res");
  const q = text.trim();
  if (q.length < 2 || !READY) { box.classList.remove("on"); rows = []; return; }
  const d = await api("search", { q });
  if (indexing(d)) return;

  rows = [];
  let html = "";
  if (d.cards.length) {
    html += '<div class="sec">Cards</div>';
    for (const c of d.cards) {
      rows.push("#c/" + encodeURIComponent(c.name));
      html += '<button class="row"><span class="mono">' + esc(c.name) + "</span>" +
        (c.golden ? ' <span class="tag w">HW</span>' : "") +
        '<span class="rt">' + esc(c.set) + " · " + esc(c.state) + "</span></button>";
    }
  }
  if (d.declines.length) {
    html += '<div class="sec">Decline families</div>';
    for (const t of d.declines) {
      rows.push("#d/token/" + encodeURIComponent(t.key));
      html += '<button class="row"><span class="mono">' + esc(t.key) +
        '</span><span class="rt">' + fmt(t.cards) + " cards</span></button>";
    }
  }
  box.innerHTML = html || '<div class="none">No match.</div>';
  box.classList.add("on");
  cursor = -1;
  box.querySelectorAll(".row").forEach((r, i) => {
    r.onclick = () => { go(rows[i]); closeSearch(); };
  });
}

function moveCursor(d) {
  const nodes = el("res").querySelectorAll(".row");
  if (!nodes.length) return;
  cursor = (cursor + d + nodes.length) % nodes.length;
  nodes.forEach((r, i) => r.classList.toggle("cur", i === cursor));
  nodes[cursor].scrollIntoView({ block: "nearest" });
}

function closeSearch() { el("res").classList.remove("on"); el("q").blur(); }

el("q").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  const v = e.target.value;
  searchTimer = setTimeout(() => search(v), 150);
});
el("q").addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { e.preventDefault(); moveCursor(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); moveCursor(-1); }
  else if (e.key === "Enter") { const i = cursor >= 0 ? cursor : 0; if (rows[i]) { go(rows[i]); closeSearch(); } }
  else if (e.key === "Escape") closeSearch();
});
document.addEventListener("click", (e) => {
  if (!e.target.closest(".searchwrap")) el("res").classList.remove("on");
});
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.key === "/" || (e.key === "k" && (e.metaKey || e.ctrlKey))) { e.preventDefault(); el("q").focus(); el("q").select(); }
});

el("home").onclick = () => go("#");
el("menu").onclick = () => el("rail").classList.toggle("show");
window.go = go;

buildNav();
route();
pollStatus();
</script>
</body>
</html>
