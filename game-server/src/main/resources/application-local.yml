# Local development overrides — activated via spring.profiles.active=local
# AI defaults to the built-in engine. Set GAME_AI_MODE=jev for the OpenRouter Jev opponent.

game:
  debug-mode: true
  sets:
    enabled:
      BLB: true
      EOE: true
      ECL: true
  ai:
    mode: ${GAME_AI_MODE:engine}
    base-url: ${GAME_AI_BASE_URL:http://localhost:11434/v1}
    api-key: ${GAME_AI_API_KEY:${OPENROUTER_API_KEY:ollama}}
    model: ${GAME_AI_MODEL:qwen/qwen3.6-plus:free}
    timeout-ms: ${GAME_AI_TIMEOUT_MS:120000}
    # Never ask the LLM for AI limited decks; the Draftsim autobuilder always builds them.
    skip-llm-deckbuilding: ${GAME_AI_SKIP_LLM_DECKBUILDING:true}
    # Browse what the AI considered, and export a position + its ratings, while playing against it.
    insight-enabled: ${GAME_AI_INSIGHT_ENABLED:true}
    # Jev uses the shared OpenRouter key with its own Decisions API endpoint.
    jev:
      endpoint: ${GAME_AI_JEV_ENDPOINT:https://openrouter.ai/api/alpha/decisions}
      model: ${GAME_AI_JEV_MODEL:typesafe/jev-1.13}
      timeout-ms: ${GAME_AI_JEV_TIMEOUT_MS:30000}
